openapi: 3.0.3
info:
  version: 1.0.0
  title: Retail Smart ERP — Auth & Identity
  description: Authentication, identity, user management, and access control endpoints.

servers:
  - url: https://api.example.com
    description: Production Server

tags:
  - name: Auth & Identity
    description: Authentication, identity, user management, and access control endpoints.
  
security:
  - cookieAuth: []
  - accountCookieAuth: []

paths:
  # ---- /auth ----
  /api/auth/validate:
    get:
      tags:
        - Auth & Identity
      summary: Validate current staff session
      description: >
        Validates the caller's current company staff session by running live database checks on every call — not just reading the session cookie.
      operationId: validateSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session is valid. All database checks passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. `reason` is present for checks 2-4. Absent when there is no session cookie at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No session cookie
                  value:
                    valid: false
                businessInactive:
                  summary: Company suspended, cancelled, or locked
                  value:
                    valid: false
                    reason: "Business not found or inactive"
                accessRevoked:
                  summary: User deactivated or deleted
                  value:
                    valid: false
                    reason: "Access revoked"
                inactivityExpired:
                  summary: No activity for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Validation error"

  /api/auth/heartbeat:
    post:
      tags:
        - Auth & Identity
      summary: Send staff session heartbeat
      description: >
        Called periodically by the client while the user is actively using the app.
      operationId: sendHeartbeat
      security:
        - cookieAuth: []
      responses:
        '200':
          description: >
            Session is valid. `users.last_active_at` has been updated to now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. `reason` is only present when the session expired due to inactivity. All other 401 cases have no `reason` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No valid session cookie or user ID is empty
                  value:
                    valid: false
                userNotFound:
                  summary: User record not found in database
                  value:
                    valid: false
                inactivityExpired:
                  summary: No heartbeat received for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Heartbeat error"

  /api/auth/ws-token:
    get:
      tags:
        - Auth & Identity
      summary: Get WebSocket authentication token
      description: >
        Issues a short-lived JWT (expires in **1 hour**, signed with HS256) for authenticating WebSocket connections. The caller must have at least one active session — either a company staff session or a platform account session.
      operationId: getWsToken
      security:
        - cookieAuth: []
        - accountCookieAuth: []
      responses:
        '200':
          description: JWT Token successfully generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTokenResponse'
              examples:
                tenantMode:
                  summary: Issued for a company staff session
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                accountMode:
                  summary: Issued for a platform account session (no active company)
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: >
            Neither a valid company session nor a valid account session was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Server error. Two possible causes:

            1. `NEXTAUTH_SECRET` environment variable is not configured — returns `"Server configuration error"`
            2. Unexpected runtime error during token generation — returns `"Failed to generate token"`

            Both cases are logged via `logError('api/auth/ws-token', error)`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSecret:
                  summary: NEXTAUTH_SECRET not configured
                  value:
                    error: "Server configuration error"
                unexpectedError:
                  summary: Runtime error during token generation
                  value:
                    error: "Failed to generate token"

  /api/auth/forgot-password:
    post:
      tags:
        - Auth & Identity
      summary: Request password reset email (platform accounts)
      description: >
        Sends a password reset email to the provided address if a matching
        platform account exists in the `accounts` table.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: "user@example.com"
      responses:
        '200':
          description: >
            Always returned — regardless of whether the email exists, the rate limit was hit, or a server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: "If an account exists with that email, we've sent password reset instructions."
        '400':
          description: >
            Request body failed schema validation. The `email` field is missing or not a valid email format. This is the **only** non-200 response this endpoint can return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "email"
                    message: "Invalid email format"

  /api/auth/reset-password:
    post:
      tags:
        - Auth & Identity
      summary: Reset platform account password
      description: >
        Completes the password reset flow initiated by `POST /api/auth/forgot-password`. Verifies the JWT from the reset email, updates `accounts.password_hash`, and revokes all active sessions for the account.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              newPassword: "NewsecureP@ss123"
      responses:
        '200':
          description: >
            Password successfully reset. All sessions have been revoked. The user may now sign in with the new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: "Password has been reset successfully. You can now sign in with your new password."
        '400':
          description: >
            Token is invalid, expired, or the account could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredOrInvalid:
                  summary: JWT expired or signature invalid
                  value:
                    error: "Invalid or expired reset link. Please request a new one."
                wrongPurpose:
                  summary: Wrong token purpose or missing fields
                  value:
                    error: "Invalid reset link. Please request a new one."
                accountNotFound:
                  summary: Account no longer exists
                  value:
                    error: "Account not found. Please request a new reset link."
                emailMismatch:
                  summary: Email in token does not match account record
                  value:
                    error: "Invalid reset link. Please request a new one."
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '429':
          description: >
            Too many reset attempts from this IP address within the last hour. Rate limit: 5 attempts per IP per hour, database-backed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many attempts. Please try again later."
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to reset password. Please try again."
  
  /api/auth/staff-forgot-password:
    post:
      tags:
        - Auth & Identity
      summary: Request staff password reset email
      description: >
        Sends a password reset email to a tenant staff user if a matching active account is found within the specified company.
      operationId: staffForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffForgotPasswordRequest'
            example:
              email: "staff@example.com"
              tenantSlug: "city-mart"
      responses:
        '200':
          description: >
            Always returned — regardless of whether the company or staff user exists, the user is active, the rate limit was hit, or a server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: "If a staff account exists with that email, we've sent password reset instructions."
        '400':
          description: >
            Request body failed schema validation. `email` or `tenantSlug` is missing or invalid. This is the **only** non-200 response this endpoint can return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "tenantSlug"
                    message: "Company slug is required"

  /api/auth/staff-reset-password:
    post:
      tags:
        - Auth & Identity
      summary: Reset staff user password
      description: >
        Completes the staff password reset flow initiated by `POST /api/auth/staff-forgot-password`. Verifies the JWT from the staff reset email, updates `users.password_hash` via RLS, and conditionally revokes active account sessions.
      operationId: staffResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffResetPasswordRequest'
            example:
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              newPassword: "NewSecureP@ss123"
      responses:
        '200':
          description: >
            Password successfully reset. Sessions revoked if user has a linked platform account. The user may now sign in with the new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: "Password has been reset successfully. You can now sign in with your new password."
        '400':
          description: >
            Token is invalid, expired, or the user could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredOrInvalid:
                  summary: JWT expired or signature invalid
                  value:
                    error: "Invalid or expired reset link. Please request a new one."
                wrongPurpose:
                  summary: Wrong token purpose or missing required fields
                  value:
                    error: "Invalid reset link. Please request a new one."
                userNotFound:
                  summary: User deleted or deactivated
                  value:
                    error: "User not found. Please request a new reset link."
                emailMismatch:
                  summary: Email in token does not match user record
                  value:
                    error: "Invalid reset link. Please request a new one."
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '429':
          description: Too many reset attempts from this IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many attempts. Please try again later."
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to reset password. Please try again."

  
  # ---- /account-auth ----
  /api/account-auth/heartbeat:
    post:
      tags:
        - Auth & Identity
      summary: Send account session heartbeat
      description: >
        Called periodically by the client while the platform account user is actively using the app.
      operationId: accountHeartbeat
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: Session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. `reason` is only present when the session expired due to inactivity. Absent for all other 401 cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No valid session cookie or account ID is empty
                  value:
                    valid: false
                accountNotFound:
                  summary: Account record not found in database
                  value:
                    valid: false
                inactivityExpired:
                  summary: No heartbeat received for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Heartbeat error"

  /api/account-auth/validate:
    get:
      tags:
        - Auth & Identity
      summary: Validate current account session
      description: >
        Validates the caller's current platform account session by running live database checks on every call.
      operationId: validateAccountSession
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: Session is valid. All checks passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. `reason` is present for checks 2-4. Absent when there is no session cookie at all (check 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No session cookie present
                  value:
                    valid: false
                sessionRevoked:
                  summary: DB session was revoked or has expired (24h)
                  value:
                    valid: false
                    reason: "Session revoked"
                accountNotFound:
                  summary: Account record no longer exists
                  value:
                    valid: false
                    reason: "Account not found"
                inactivityExpired:
                  summary: No heartbeat for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Validation error"

  /api/account-auth/transfer:
    post:
      tags:
        - Auth & Identity
      summary: Generate company transfer token
      description: >
        Generates a short-lived JWT (valid for **30 seconds**) that allows a platform account owner to enter a company (tenant) session without re-entering credentials.
      operationId: generateTransferToken
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferAuthRequest'
            examples:
              byTenantId:
                summary: Transfer using company UUID
                value:
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
              byTenantSlug:
                summary: Transfer using company slug
                value:
                  tenantSlug: "city-mart"
      responses:
        '200':
          description: Transfer token successfully generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferAuthResponse'
              example:
                transferToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…"
                slug: "city-mart"
        '401':
          description: No valid account session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: >
            The account does not have an active membership in the requested company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "No access to this company"
        '404':
          description: Company not found or not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Company not found or inactive"
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSecret:
                  summary: NEXTAUTH_SECRET not configured
                  value:
                    error: "Server configuration error"
                unexpectedError:
                  summary: Unexpected runtime error
                  value:
                    error: "Failed to generate transfer token"

  # ---- /register ----
  /api/register:
    post:
      tags:
        - Auth & Identity
      summary: Register a new platform account
      description: >
        Creates a new platform account for an owner or manager. **This endpoint creates an entry in the `accounts` table — not `users`.** Registration does not create a session; the user must sign in separately after successful registration.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: "Jane Smith"
              email: "jane@example.com"
              password: "SecureP@ss123"
              country: "LK"
              phone: "+94771234567"
              tosAcceptedAt: "2026-03-12T09:00:00.000Z"
      responses:
        '200':
          description: >
            Account created successfully. User must sign in separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                success: true
                message: "Account created successfully. Please sign in."
                accountId: "a1b2c3d4-5678-90ab-cdef-1234567890ab"
        '400':
          description: >
            Validation error or duplicate account detected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCountry:
                  summary: Country code not in supported list
                  value:
                    error: "Invalid country selected"
                duplicateEmail:
                  summary: Email already registered
                  value:
                    error: "This email is already registered"
                duplicatePhone:
                  summary: Phone number already registered
                  value:
                    error: "This mobile number is already registered"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '429':
          description: >
            Too many registration attempts from this IP address. Maximum 5 per hour, database-backed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many registration attempts. Please try again later."
        '500':
          description: >
            Unexpected server error during registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Registration failed. Please try again."
  
  /api/register/check-email:
    post:
      tags:
        - Auth & Identity
      summary: Check email availability for registration
      description: >
        Checks whether an email address is available for a new platform account. Designed for real-time "as-you-type" feedback during registration forms — not a substitute for the uniqueness enforcement in `POST /api/register`.
      operationId: checkEmailAvailability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEmailRequest'
            example:
              email: "jane@example.com"
      responses:
        '200':
          description: >
            Email availability check completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckEmailResponse'
              examples:
                available:
                  summary:  Email is available
                  value:
                    available: true
                taken:
                  summary: Email already registered
                  value:
                    available: false
        '400':
          description: >
            Request body failed schema validation. `email` is missing or not a valid email format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "email"
                    message: "Invalid email format"
        '429':
          description: >
            Too many requests from this IP address within the last minute. Maximum 10 requests per IP per minute, stored in-memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many requests. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to check email"

  /api/register/send-otp:
    post:
      tags:
        - Auth & Identity
      summary: Send OTP verification code
      description: >
        Generates a 5-digit OTP, stores a bcrypt hash in the `email_verification_otps` table, and sends the plaintext code to the specified email address via Resend API. Used in both the registration flow and the password reset flow.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
            examples:
              registration:
                summary: Send OTP for email registration
                value:
                  email: "jane@example.com"
                  type: "registration"
              passwordReset:
                summary: Send OTP for password reset
                value:
                  email: "jane@example.com"
                  type: "password_reset"
      responses:
        '200':
          description: >
            OTP generated and sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: "Verification code sent"
        '400':
          description: >
            Request body failed schema validation. `email` is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Validation failed"
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: "email"
                        message:
                          type: string
                          example: "Invalid email format"
        '429':
          description: >
            Too many OTP requests for this email and type combination within the last hour. Maximum 5 per email+type per hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many verification attempts. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to send verification code. Please try again."
  
  /api/register/verify-otp:
    post:
      tags:
        - Auth & Identity
      summary: Verify OTP code and receive verification token
      description: >
        Verifies a 5-digit OTP code submitted by the user against the bcrypt hash stored in `email_verification_otps`. On success, marks the OTP record as used and issues a short-lived `verificationToken` JWT (15 min).
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              email: "jane@example.com"
              otp: "47291"
              type: "registration"
      responses:
        '200':
          description: >
            OTP verified successfully. `verificationToken` issued. Valid for 15 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
              example:
                success: true
                verificationToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: >
            OTP verification failed. See `error` field for specific reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noOtpFound:
                  summary: No unverified OTP found for this email+type
                  value:
                    error: "No verification code found. Please request a new one."
                expired:
                  summary: OTP has expired (10-minute window)
                  value:
                    error: "Verification code has expired. Please request a new one."
                tooManyAttempts:
                  summary: 5 attempts exhausted
                  value:
                    error: "Too many incorrect attempts. Please request a new code."
                incorrectCode:
                  summary: Wrong OTP — shows remaining attempts
                  value:
                    error: "Incorrect code. 3 attempts remaining."
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Verification failed. Please try again."

  # ---- /lookup-tenant ----
  /api/lookup-tenant:
    post:
      tags:
        - Auth & Identity
      summary: Look up companies by email address
      description: >
        Returns a list of active companies associated with the given email address. Used on the login page to show the user which companies they can sign into.
      operationId: lookupTenantByEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTenantRequest'
            example:
              email: "jane@example.com"
      responses:
        '200':
          description: >
            Lookup completed. Returns an empty array if the email has no active company memberships or is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTenantResponse'
              examples:
                found:
                  summary: Email associated with one or more companies
                  value:
                    tenants:
                      - slug: "city-mart"
                        name: "City Mart"
                notFound:
                  summary: Email not registered or no active memberships
                  value:
                    tenants: []
        '400':
          description: >
            Request body failed schema validation. `email` is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Validation failed"
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: "email"
                        message:
                          type: string
                          example: "Invalid email format"
        '429':
          description: >
            Too many requests for this email address within the last minute. Maximum 5 requests per email per minute, in-memory. Response time is still padded to 200ms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many requests. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Lookup failed"
    get:
      tags:
        - Auth & Identity
      summary: Look up a company by slug (internal middleware use only)
      description: >
        Validates whether a given company slug exists and is active. 
        **This endpoint is for internal server use only.**
      operationId: lookupTenantBySlug
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema: 
            type: string
          description: >
            The company URL slug to validate.
          example: "city-mart"
        - name: x-internal-secret
          in: header
          required: true
          schema:
            type: string
          description: >
            Must equal `NEXTAUTH_SECRET`. Requests with a missing or mismatched value receive `401 Unauthorized`.
      responses:
        '200':
          description: >
            Lookup completed. `tenant` is `null` if no active company exists for the given slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTenantBySlugResponse'
              examples:
                found:
                  summary: Active company found for slug
                  value:
                    tenant:
                      id: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                      slug: "city-mart"
                notFound:
                  summary: No active company for slug
                  value:
                    tenant: null
        '400':
          description: >
            `slug` query parameter is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Slug required"
        '401':
          description: >
            Missing or invalid `x-internal-secret` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '429':
          description: >
            Too many requests for this slug within the last minute. Maximum 5 requests per slug per minute, in-memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many requests"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Lookup failed"

  # ---- /invites ----
  /api/invites/{token}:
    get:
      tags:
        - Auth & Identity
      summary: Get staff invite details
      description: >
        Returns public details of a staff invite for display on the acceptance page. Validates that the invite exists, has not been accepted, and has not expired.
      operationId: getInviteDetails
      security: []
      parameters:
        - $ref: '#/components/parameters/PathToken'
      responses:
        '200':
          description: >
            Invite is valid. Returns public details for the acceptance page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteDetailsResponse'
              example:
                email: "j***e@example.com"
                invitedBy: "Jane Smith"
                expiresAt: "2026-03-23T09:00:00.000Z"
                tenantAssignments:
                  - tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                    tenantName: "City Mart"
                    tenantSlug: "city-mart"
                    businessType: "retail"
                    role: "cashier"
                hasExistingAccount: false
        '400':
          description: >
            Invite has already been accepted, or has expired. Same error message as 404 to prevent distinguishing between states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired invite"
        '404':
          description: >
            No invite found for this token. Same error message as 400 to prevent distinguishing between states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired invite"
        '429':
          description: >
            Too many requests for this token prefix within the last minute. Maximum 10 requests per minute per token prefix (first 8 chars), in-memory. Response time is still padded to 100ms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                error: "Too many requests. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"

  /api/invites/{token}/accept:
    post:
      tags:
        - Auth & Identity
      summary: Accept a staff invite
      description: >
        Accepts a staff invite identified by the path token. Creates the necessary `users` and/or `account_tenants` records, then marks the invite as accepted.
      operationId: acceptInvite
      security: []
      parameters:
        - $ref: '#/components/parameters/PathToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
            examples:
              existingAccount:
                summary: Accepting as an existing platform account holder
                value: {}
              newStaffMember:
                summary: Accepting as a new staff member (no existing account)
                value:
                  fullName: "John Smith"
                  password: "SecureP@ss123"
      responses:
        '200':
          description: >
            Invite accepted successfully. All user and membership records created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteResponse'
              example:
                success: true
                message: "Invite accepted successfully"
                email: "john.smith@example.com"
                companies:
                  - tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                    tenantName: "City Mart"
                    tenantSlug: "city-mart"
                    role: "cashier"
        '400':
          description: >
            Invite is invalid, expired, or already accepted. Also returned when `fullName` or `password` are missing for a new staff member, or when the password does not meet strength requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInvite:
                  summary: Invite not found, already accepted, or expired
                  value:
                    error: "Invalid or expired invite"
                missingFields:
                  summary: fullName or password missing for new staff member
                  value:
                    error: "Full name and password are required for new staff members"
                weakPassword:
                  summary: Password does not meet strength requirements
                  value:
                    error: "Password must contain at least one uppercase letter"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '429':
          description: >
            Too many accept attempts for this token prefix within the last minute. Maximum 5 requests per minute per token prefix (first 8 chars), in-memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many attempts. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"

  # ---- /users ----
  /api/users:
    get:
      tags:
        - Auth & Identity
      summary: List staff users
      description: >
        Returns all staff users for the current tenant. Results are scoped by RLS — only users belonging to the caller's tenant are returned. `passwordHash` is never included in any response.
      operationId: listUsers
      security:
        - cookieAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRoleEnum'
          description: >
            Filter results to a specific role.
        - name: activeOnly
          in: query
          required: false
          schema:
            type: string
            enum: ["true"]
          description: >
            Set to `"true"` to return only active users.
        - name: includeWarehouses
          in: query
          required: false
          schema:
            type: string
            enum: ["true"]
          description: >
            Set to `"true"` to include active warehouse assignments per user.
      responses:
        '200':
          description: >
            List of staff users for the current tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserListItem'
        '401':
          description: >
            No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch users"
    post:
      tags:
        - Auth & Identity
      summary: Add or invite a staff user
      description: >
        Adds a staff user to the current tenant. Behavior depends on whether the invitee's email already has a registered platform account.
      operationId: createOrInviteUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: "john@example.com"
              role: "cashier"
              warehouseIds: ["d4e5f6a7-8901-2345-bcde-f01234567890"]
      responses:
        '200':
          description: >
            User added immediately or invite created and emailed. Check `mode` field to distinguish between the two outcomes.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AddedUserResponse'
                  - $ref: '#/components/schemas/InvitedUserResponse'
              examples:
                added:
                  summary: User added immediately (had existing account)
                  value:
                    mode: "added"
                    user:
                      id: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
                      email: "john@example.com"
                      fullName: "John Smith"
                      role: "cashier"
                      isActive: true
                      createdAt: "2026-03-25T09:00:00.000Z"
                      updatedAt: "2026-03-25T09:00:00.000Z"
                invited:
                  summary: Invite created and emailed (no existing account)
                  value:
                    mode: "invited"
                    invite:
                      id: "f6a7b8c9-0123-4567-def0-123456789012"
                      email: "john@example.com"
                      role: "cashier"
                      expiresAt: "2026-04-01T09:00:00.000Z"
                      inviteUrl: "https://app.retailsmarterp.com/invite/abc123..."
        '400':
          description: >
            `owner` role requested, or user with this email already exists in this tenant, or duplicate pending invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerRole:
                  value:
                    error: "Invalid role. Owner role can only be assigned through account management."
                alreadyExists:
                  value:
                    error: "A user with this email already exists in this company"
                duplicateInvite:
                  value:
                    error: "An invitation has already been sent to this email"
                validationFailed:
                  value:
                    error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '402':
          description: Tenant has reached the database storage limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageQuotaError'
              example:
                error: "Database storage limit reached. Please upgrade your plan to create new records."
                code: "STORAGE_LIMIT"
                quotaType: "standard" 
        '403':
          description: >
            Caller lacks `manageUsers` permission, or attempted to assign a role at or above their own level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientPermissions:
                  value:
                    error: "Insufficient permissions"
                roleTooHigh:
                  value:
                    error: "You cannot create users with this role"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to create user"
  
  /api/users/{id}:
    get:
      tags:
        - Auth & Identity
      summary: Get a staff user by ID
      description: >
        Returns a single staff user by UUID, scoped to the caller's tenant via RLS. `passwordHash` is never included in the response. No permission check beyond session authentication is required.
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: User found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListItem'
              example:
                id: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
                email: "john@example.com"
                fullName: "John Smith"
                role: "cashier"
                isActive: true
                lastLoginAt: "2026-03-25T09:00:00.000Z"
                createdAt: "2026-01-01T00:00:00.000Z"
                updatedAt: "2026-03-01T00:00:00.000Z"
        '401':
          description: No valid company session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: User not found in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch user"
    put:
      tags:
        - Auth & Identity
      summary: Update a staff user
      description: >
        Updates one or more fields on a staff user record. All request fields are optional. Uses `SELECT FOR UPDATE` + `expectedUpdatedAt` for optimistic concurrency control.
      operationId: updateUser
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              fullName: "Jane Smith"
              role: "manager"
              expectedUpdatedAt: "2026-03-25T09:00:00.000Z"
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListItem'
              example:
                id: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
                email: "jane@example.com"
                fullName: "Jane Smith"
                role: "manager"
                isActive: true
                lastLoginAt: "2026-03-25T09:00:00.000Z"
                createdAt: "2026-01-01T00:00:00.000Z"
                updatedAt: "2026-03-25T10:00:00.000Z"
        '400':
          description: >
            Validation error, self-modification attempt, or duplicate email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownRole:
                  summary: Caller tried to change own role
                  value:
                    error: "You cannot change your own role"
                ownStatus:
                  summary: Caller tried to change own isActive
                  value:
                    error: "You cannot change your own status"
                emailExists:
                  summary: Email already in use in this tenant
                  value:
                    error: "A user with this email already exists"
                invalidPassword:
                  summary: Password does not meet strength requirements
                  value:
                    error: "Password must be at least 8 characters"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '401':
          description: >
            No valid company session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: >
            Caller lacks `manageUsers` permission, or the target user has a higher role level than the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientPermissions:
                  summary: Missing manageUsers permission
                  value:
                    error: "Insufficient permissions"
                insufficientRank:
                  summary: Target user role is above caller's level
                  value:
                    error: "You do not have permission to modify this user"
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
        '409':
          description: >
            Optimistic lock conflict. The record was modified by another request after the client's `expectedUpdatedAt` timestamp. Refresh the user record and retry the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponse'
              example:
                error: "This user was modified by another user. Please refresh and try again."
                code: "CONFLICT"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update user"
    delete:
      tags:
        - Auth & Identity
      summary: Deactivate (soft-delete) a staff user
      description: >
        Sets `users.is_active = false` for the specified user. **This is a soft delete — the `users` record is NOT removed from the database.**
      operationId: deactivateUser
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: User deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: >
            Caller attempted to deactivate their own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "You cannot deactivate your own account"
        '401':
          description: No valid company session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: >
            Caller lacks `manageUsers` permission, or the target user's role is above the caller's level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientPermissions:
                  summary: Missing manageUsers permission
                  value:
                    error: "Insufficient permissions"
                insufficientRank:
                  summary: Target user role is above caller's level
                  value:
                    error: "You do not have permission to deactivate this user"
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to delete user"

  /api/users/{id}/warehouses:
    get:
      tags:
        - Auth & Identity
      summary: Get user's warehouse assignments
      description: >
        Returns all warehouse assignments and POS profile assignments for a staff user. No permission beyond session authentication is required.
      operationId: getUserWarehouses
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: >
            Warehouse and POS profile assignments returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWarehouseAssignmentsResponse'
              example:
                assignments:
                  - id: "d0e1f2a3-4567-8901-1234-567890123456"
                    userId: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
                    warehouseId: "d4e5f6a7-8901-2345-bcde-f01234567890"
                    isActive: true
                    warehouse:
                      id: "d4e5f6a7-8901-2345-bcde-f01234567890"
                      name: "Main Warehouse"
                      code: "WH-001"
                      isDefault: true
                posProfileAssignments:
                  - id: "f2a3b4c5-6789-0123-3456-789012345678"
                    userId: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
                    posProfileId: "e1f2a3b4-5678-9012-2345-678901234567"
                    posProfile:
                      id: "e1f2a3b4-5678-9012-2345-678901234567"
                      name: "Counter 1"
                      warehouse:
                        id: "d4e5f6a7-8901-2345-bcde-f01234567890"
                        name: "Main Warehouse"
                        code: "WH-001"
                        isDefault: true
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: User not found in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: "Failed to fetch user warehouse assignments"
    put:
      tags:
        - Auth & Identity
      summary: Replace user's warehouse assignments
      description: >
        Replaces a user's warehouse assignments with the provided list. This is a **full replace** — the `warehouseIds` array represents the complete desired state, not a patch. Assignments not in the list are removed; IDs not currently assigned are added. An empty array removes all assignments.
      operationId: updateUserWarehouses
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserWarehousesRequest'
            examples:
              assign:
                summary: Assign two warehouses
                value:
                  warehouseIds:
                    - "d4e5f6a7-8901-2345-bcde-f01234567890"
                    - "d4e5f6a7-8901-2345-bcde-f01234567891"
              removeAll:
                summary: Remove all warehouse assignments
                value:
                  warehouseIds: []
      responses:
        '200':
          description: >
            Warehouse assignments updated. Returns the full updated list with counts of added and removed entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserWarehousesResponse'
              example:
                assignments:
                  - id: "d0e1f2a3-4567-8901-1234-567890123456"
                    userId: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
                    warehouseId: "d4e5f6a7-8901-2345-bcde-f01234567890"
                    isActive: true
                    warehouse:
                      id: "d4e5f6a7-8901-2345-bcde-f01234567890"
                      name: "Main Warehouse"
                      code: "WH-001"
                      isDefault: true
                added: 1
                removed: 0
        '400':
          description: >
            One or more warehouse IDs not found in this tenant, or request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                warehouseNotFound:
                  summary: Invalid warehouse ID in list
                  value:
                    error: "One or more warehouses not found"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: >
            Caller lacks `manageUsers` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Insufficient permissions"
        '404':
          description: User not found in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update user warehouse assignments"

  /api/users/invites:
    get:
      tags:
        - Auth & Identity
      summary: List pending staff invites
      description: >
        Returns all non-accepted staff invites for the current tenant, including both pending and expired invites.
      operationId: listPendingInvites
      security:
        - cookieAuth: []
      responses:
        '200':
          description: >
            List of non-accepted invites for the current tenant. Empty array if none exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingInviteItem'
              example:
                - id: "f6a7b8c9-0123-4567-def0-123456789012"
                  email: "john@example.com"
                  role: "cashier"
                  expiresAt: "2026-04-01T09:00:00.000Z"
                  createdAt: "2026-03-25T09:00:00.000Z"
                  status: "pending"
                - id: "f6a7b8c9-0123-4567-def0-123456789013"
                  email: "jane@example.com"
                  role: "manager"
                  expiresAt: "2026-03-20T09:00:00.000Z"
                  createdAt: "2026-03-13T09:00:00.000Z"
                  status: "expired"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: Caller lacks `manageUsers` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Insufficient permissions"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch invites"
    delete:
      tags:
        - Auth & Identity
      summary: Cancel a pending staff invite
      description: >
        Cancels a staff invite for the current tenant.
      operationId: cancelInvite
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the invite to cancel. (`staff_invites.id`)
          example: "f6a7b8c9-0123-4567-def0-123456789012"
      responses:
        '200':
          description: Invite successfully cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: >
            `id` query parameter is missing, or invite has already been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingId:
                  summary: id query parameter not provided
                  value:
                    error: "Invite ID is required"
                alreadyAccepted:
                  summary: Invite was already accepted
                  value:
                    error: "Cannot cancel an already accepted invite"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: Caller lacks `manageUsers` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Insufficient permissions"
        '404':
          description: >
            Invite not found, or caller's tenant is not in the invite's `tenant_assignments`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invite not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to cancel invite"
      
  /api/users/invites/{id}/resend:
    post:
      tags:
        - Auth & Identity
      summary: Resend a staff invite email
      description: >
        Extends the invite's expiry by 7 days from now and resends the invitation email to the original recipient.
      operationId: resendInvite
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: >
            Invite expiry extended and email resent successfully. Returns the new expiry timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendInviteResponse'
              example:
                success: true
                expiresAt: "2026-04-01T09:00:00.000Z"
        '400':
          description: Invite has already been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invite has already been accepted"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: >
            Invite not found, or belongs to another tenant. Both cases return the same message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invite not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to resend invite"

  # ---- /custom-roles ----
  /api/custom-roles:
    post:
      tags:
        - Auth & Identity
      summary: Create a custom role
      description: >
        Creates a new custom role for the current tenant. A URL-safe slug is auto-generated from the `name` field.
      operationId: createCustomRole
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomRoleRequest'
            example:
              name: "Senior Cashier"
              baseRole: "cashier"
              description: "Cashier with additional inventory view access"
              color: "#3b82f6"
              permissions:
                manageItems: true
                viewReports: false
      responses:
        '201':
          description: >
            Custom role created successfully. Returns the created role record without `permissions` map (permissions are stored separately in `role_permission_overrides`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoleItem'
              example:
                id: "e5f6a7b8-9012-3456-cdef-012345678901"
                tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                name: "Senior Cashier"
                slug: "senior_cashier"
                baseRole: "cashier"
                description: "Cashier with additional inventory view access"
                color: "#3b82f6"
                createdBy: "f2a3b4c5-6789-0123-3456-789012345678"
                createdAt: "2026-03-25T09:00:00.000Z"
                updatedAt: "2026-03-25T09:00:00.000Z"
                permissions: {}
        '400':
          description: >
            `baseRole` is `"owner"`, slug generation produced an empty string, a role with the same name already exists, or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerBase:
                  summary: baseRole is owner
                  value:
                    error: "Cannot create custom roles based on owner"
                invalidName:
                  summary: Name produced an empty slug
                  value:
                    error: "Invalid role name"
                duplicateName:
                  summary: A role with this slug already exists
                  value:
                    error: "A custom role with this name already exists"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '402':
          description: Tenant has reached the database storage limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageQuotaError'
              example:
                error: "Database storage limit reached. Please upgrade your plan to create new records."
                code: "STORAGE_LIMIT"
                quotaType: "standard"
        '403':
          description: >
            Caller lacks `manageTenant` permission — only `owner` has this permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Insufficient permissions"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to create custom role"
    get:
      tags:
        - Auth & Identity
      summary: List custom roles
      description: >
        Returns all custom roles for the current tenant, each including its permission overrides as a `permissions` map. No permission check beyond session authentication is required.
      operationId: listCustomRoles
      security: 
        - cookieAuth: []
      responses:
        '200':
          description: >
            List of custom roles. Empty array if none defined.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomRoleItem'
              example:
                - id: "e5f6a7b8-9012-3456-cdef-012345678901"
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                  name: "Senior Cashier"
                  slug: "senior_cashier"
                  baseRole: "cashier"
                  description: "Cashier with additional inventory view access"
                  color: "#3b82f6"
                  createdBy: "f2a3b4c5-6789-0123-3456-789012345678"
                  createdAt: "2026-03-25T09:00:00.000Z"
                  updatedAt: "2026-03-25T09:00:00.000Z"
                  permissions:
                    manageItems: true
                    viewReports: false
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch custom roles"

  /api/custom-roles/{id}:
    put:
      tags:
        - Auth & Identity
      summary: Update a custom role
      description: >
        Updates one or more fields of a custom role. All fields are optional.
      operationId: updateCustomRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomRoleRequest'
            example:
              name: "Front Counter Staff"
              color: "#10b981"
              isActive: true
              permissions:
                createSales: true
                manageItems: false
      responses:
        '200':
          description: >
            Custom role updated successfully. Returns the full updated role record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoleItem'
              example:
                id: "e5f6a7b8-9012-3456-cdef-012345678901"
                tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                name: "Front Counter Staff"
                slug: "front_counter_staff"
                baseRole: "cashier"
                description: "Counter staff with limited inventory access"
                color: "#10b981"
                isActive: true
                createdBy: "f2a3b4c5-6789-0123-3456-789012345678"
                createdAt: "2026-03-25T09:00:00.000Z"
                updatedAt: "2026-03-25T10:00:00.000Z"
                permissions: {}
        '400':
          description: >
            `baseRole` is `"owner"`, or request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerBase:
                  summary: baseRole is owner
                  value:
                    error: "Cannot base custom roles on owner"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: Custom role not found in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Custom role not found"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update custom role"
    delete:
      tags:
        - Auth & Identity
      summary: Delete a custom role
      description: >
        Permanently deletes a custom role and all its permission overrides. Blocked if any staff user has this role assigned.
      operationId: deleteCustomRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Custom role deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: >
            One or more users still have this custom role assigned. Reassign users before deleting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Cannot delete a custom role that has users assigned to it. Reassign users first."
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: Custom role not found in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Custom role not found"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to delete custom role"

  # ---- /role-permissions ----
  /api/role-permissions:
    get:
      tags:
        - Auth & Identity
      summary: Get all role permission and overrides
      description: >
        Returns the complete permission configuration for the tenant in a single response: tenant-specific built-in role overrides, all custom roles with their permissions, and the application's system defaults.
      operationId: getRolePermissions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: >
            Full role permission configuration returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
              example:
                builtinOverrides:
                  manager:
                    voidSales: false
                    viewReports: true
                customRoles:
                  - id: "e5f6a7b8-9012-3456-cdef-012345678901"
                    tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                    name: "Senior Cashier"
                    slug: "senior_cashier"
                    baseRole: "cashier"
                    description: null
                    color: "#3b82f6"
                    createdBy: "f2a3b4c5-6789-0123-3456-789012345678"
                    createdAt: "2026-03-25T09:00:00.000Z"
                    updatedAt: "2026-03-25T09:00:00.000Z"
                    permissions:
                      manageItems: true
                systemDefaults:
                  manageSettings:
                    - owner
                    - system_manager
                  manageUsers:
                    - owner
                    - manager
                    - system_manager
                  createSales:
                    - owner
                    - manager
                    - cashier
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch role permissions"
    put:
      tags:
        - Auth & Identity
      summary: Update built-in role permission overrides
      description: >
        Replaces all tenant-specific permission overrides for a single built-in role. This is a **full replace** — all existing overrides for the role are deleted and re-inserted from the provided `overrides` map.
      operationId: updateRolePermissions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
            example:
              role: "manager"
              overrides:
                createSales: true
                voidSales: false
                viewReports: true
      responses:
        '200':
          description: >
            Role permission overrides updated successfully. Cache invalidated and broadcast sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: >
            `role` is `"owner"`, an unknown permission key was provided, or an owner-only permission was set to `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerRole:
                  summary: role is owner
                  value:
                    error: "Owner permissions cannot be modified"
                invalidPermission:
                  summary: Unknown permission key in overrides
                  value:
                    error: "Invalid permission: someUnknownKey"
                ownerOnlyPermission:
                  summary: Owner-only permission set to true
                  value:
                    error: "Permission \"manageTenant\" can only be assigned to owners"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update role permissions"

  /api/role-permissions/effective:
    get:
      tags:
        - Auth & Identity
      summary: Get effective permissions for current user
      description: >
        Returns a complete map of all permission keys to their effective `true`/`false` values for the requesting staff user.
      operationId: getEffectivePermissions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: >
            Effective permissions computed and returned. All permission keys are present in the map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissionsResponse'
              example:
                permissions:
                  manageSettings: false
                  manageTenant: false
                  manageModuleAccess: false
                  manageUsers: true
                  manageItems: false
                  createSales: true
                  voidSales: false
                  viewReports: false
                  managePurchases: false
                  manageCustomers: true
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to get permissions"

  /api/role-permissions/reset:
    post:
      tags:
        - Auth & Identity
      summary: Reset a built-in role's permissions to system defaults
      description: >
        Deletes all tenant-specific permission overrides for the specified built-in role. After this call, the role's effective permissions revert to the application's system defaults (`ROLE_PERMISSIONS`).
      operationId: resetRolePermissions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRolePermissionsRequest'
            example:
              role: "manager"
      responses:
        '200':
          description: >
            Role permissions successfully reset to system defaults.
            All overrides for this role in this tenant have been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: >
            `role` is `"owner"`, or request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerRole:
                  summary: role is owner
                  value:
                    error: "Owner permissions cannot be modified"
                validationFailed:
                  summary: Request body failed schema validation
                  value:
                    error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to reset role permissions"

  # ---- /module-access ----
  /api/module-access:
    put:
      tags:
        - Auth & Identity
      summary: Bulk upsert module access entries
      description: >
        Upserts one or more module access entries for the current tenant.
        Each entry is identified by the `moduleKey` + `role` combination.
        Existing records are updated; new combinations are inserted.
      operationId: updateModuleAccess
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModuleAccessRequest'
            example:
              entries:
                - moduleKey: "pos"
                  role: "cashier"
                  isEnabled: true
                - moduleKey: "inventory"
                  role: "cashier"
                  isEnabled: false
                - moduleKey: "reports"
                  role: "manager"
                  isEnabled: true
      responses:
        '200':
          description: >
            Entries upserted successfully.
            Returns the full updated list of all module access records for the tenant, sorted by `moduleKey` then `role`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAccessRecord'
              example:
                - id: "c9d0e1f2-3456-7890-0123-456789012345"
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                  moduleKey: "inventory"
                  role: "cashier"
                  isEnabled: false
                  updatedBy: "f2a3b4c5-6789-0123-3456-789012345678"
                  updatedAt: "2026-03-25T10:00:00.000Z"
                  createdAt: "2026-03-01T00:00:00.000Z"
                - id: "c9d0e1f2-3456-7890-0123-456789012346"
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                  moduleKey: "pos"
                  role: "cashier"
                  isEnabled: true
                  updatedBy: "f2a3b4c5-6789-0123-3456-789012345678"
                  updatedAt: "2026-03-25T10:00:00.000Z"
                  createdAt: "2026-03-01T00:00:00.000Z"
        '400':
          description: >
            Request body failed schema validation — `entries` is empty or an entry is missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update module access"
    get:
      tags:
        - Auth & Identity
      summary: Get all module access records
      description: >
        Returns all `module_access` records for the current tenant, sorted by `moduleKey` ascending then `role` ascending.
        No permission beyond session authentication is required.
      operationId: getModuleAccess
      security:
        - cookieAuth: []
      responses:
        '200':
          description: >
            All module access records returned. Empty array if none configured.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAccessRecord'
              example:
                - id: "c9d0e1f2-3456-7890-0123-456789012345"
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                  moduleKey: "inventory"
                  role: "cashier"
                  isEnabled: false
                  updatedBy: "f2a3b4c5-6789-0123-3456-789012345678"
                  updatedAt: "2026-03-25T09:00:00.000Z"
                  createdAt: "2026-03-01T00:00:00.000Z"
                - id: "c9d0e1f2-3456-7890-0123-456789012346"
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                  moduleKey: "pos"
                  role: "cashier"
                  isEnabled: true
                  updatedBy: "f2a3b4c5-6789-0123-3456-789012345678"
                  updatedAt: "2026-03-25T09:00:00.000Z"
                  createdAt: "2026-03-01T00:00:00.000Z"
        '401':
          description: No valid company session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch module access"

  # ---- /account/sessions ----
  /api/account/sessions:
    get:
      tags:
        - Auth & Identity
      summary: List active sessions for the current account
      description: >
        Returns all active (non-revoked, non-expired) sessions for the current platform account. The `isCurrent` flag identifies which session belongs to the caller. `sessionToken` is never returned.
      operationId: listAccountSessions
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: >
            Active sessions returned. Empty `sessions` array if none active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSessionsResponse'
              example:
                sessions:
                  - id: "a7b8c9d0-1234-5678-ef01-234567890123"
                    scope: "account"
                    tenantSlug: null
                    ipAddress: "203.0.113.42"
                    deviceName: "Chrome on Windows"
                    lastActivityAt: "2026-03-25T08:55:00.000Z"
                    createdAt: "2026-03-25T09:00:00.000Z"
                    expiresAt: "2026-03-26T09:00:00.000Z"
                    isCurrent: true
                  - id: "a7b8c9d0-1234-5678-ef01-234567890124"
                    scope: "company"
                    tenantSlug: "my-company"
                    ipAddress: "203.0.113.55"
                    deviceName: "Safari on iPhone"
                    lastActivityAt: "2026-03-24T14:30:00.000Z"
                    createdAt: "2026-03-24T14:00:00.000Z"
                    expiresAt: "2026-03-25T14:00:00.000Z"
                    isCurrent: false
        '401':
          description: No valid account session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to list sessions"
    delete:
      tags:
        - Auth & Identity
      summary: Revoke all account sessions
      description: >
        Revokes all active sessions for the current account.
        Pass `exceptCurrent: true` to preserve the caller's own session (sign out all other devices).
      operationId: revokeAllAccountSessions
      security:
        - accountCookieAuth: []
      parameters:
        - name: exceptCurrent
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When `true`, the caller's own current session is preserved and all other sessions are revoked.
            When `false` or omitted, all sessions including the current one are revoked.
            (Note: the server implementation reads this value from the request body JSON field `exceptCurrent`.)
          example: true
      responses:
        '200':
          description: >
            Sessions revoked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: Request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
        '401':
          description: No valid account session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to revoke sessions"

  /api/account/sessions/{id}:
    delete:
      tags:
        - Auth & Identity
      summary: Revoke a single session by ID
      description: >
        Revokes a single `account_sessions` record identified by its UUID. 
        Only sessions belonging to the current account can be revoked.
        The caller's own current session cannot be revoked via this endpoint — use `DELETE /api/account/sessions` with `exceptCurrent: false` instead.
      operationId: revokeAccountSession
      security:
        - accountCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Session successfully revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: >
            Session is already revoked, or the target session is the caller's own current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyRevoked:
                  summary: Session was already revoked
                  value:
                    error: "Session already revoked"
                currentSession:
                  summary: Caller tried to revoke their own current session
                  value:
                    error: "Cannot revoke your current session"
        '401':
          description: No valid account session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: >
            Session not found, or the session belongs to a different account. Both cases return the same message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Session not found"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to revoke session"









components:
  securitySchemes:
    # ---- auth ----
    cookieAuth:
      type: apiKey
      in: cookie
      name: company-session
      description: >
        Staff session cookie set by NextAuth.js at `/api/auth`. Cookie name is `company-session`.

    # ---- account-auth ----
    accountCookieAuth:
      type: apiKey
      in: cookie
      name: account-session
      description: >
        Platform account session cookie set by NextAuth.js at `/api/account-auth`. Cookie name is `account-session`.
  
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID.
      example: "u1b2c3d4-5678-90ab-cdef-1234567890ab"

    PathToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Invite token (URL-safe random string).
      example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"

  schemas:
    # ---- Enums ----
    UserRoleEnum:
      type: string
      description: >
        All valid staff role values including `owner`.
      enum:
        - owner
        - manager
        - cashier
        - technician
        - chef
        - waiter
        - system_manager
        - accounts_manager
        - sales_manager
        - purchase_manager
        - hr_manager
        - stock_manager
        - pos_user
        - report_user
        - dealer_sales
      example: "cashier"

    AssignableRoleEnum:
      type: string
      description: >
        Staff roles assignable via API. Excludes `owner` — owner role can only be assigned through the account dashboard.
      enum:
        - manager
        - cashier
        - technician
        - chef
        - waiter
        - system_manager
        - accounts_manager
        - sales_manager
        - purchase_manager
        - hr_manager
        - stock_manager
        - pos_user
        - report_user
        - dealer_sales
      example: "cashier"
    
    # ---- Error Responses ----
    StorageQuotaError:
      type: object
      description: >
        Returned when the tenant has reached their database storage limit.
      properties:
        error:
          type: string
          example: "Database storage limit reached. Please upgrade your plan to create new records."
        code:
          type: string
          enum:
            - STORAGE_LIMIT
          example: "STORAGE_LIMIT"
        quotaType:
          type: string
          enum:
            - standard
            - essential
            - file
          example: "standard"
      required:
        - error
        - code
        - quotaType

    ValidationErrorResponse:
      type: object
      description: >
        Returned when request body or query parameters fail schema validation.
        Contains a `details` array with field-level error messages.
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "Invalid email format"
      required:
        - error
        - details

    # ---- Common ----
    ErrorResponse:
      type: object
      description: >
        Standard error response returned on all failure paths.
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "Unauthorized"
      required:
        - error
    
    # ---- Authentication ----
    WsTokenResponse:
      type: object
      description: >
        Response containing a short-lived JWT for WebSocket authentication. The token payload differs based on which session type was active.
      properties:
        token:
          type: string
          description: >
            A JWT signed with `NEXTAUTH_SECRET` using HS256, valid for **1 hour**.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - token

    ValidationResponse:
      type: object
      description: >
        Response shape shared by session validation and heartbeat endpoints.
      properties:
        valid:
          type: boolean
          description: >
            `true` if the session all checks. `false` on any failure.
          example: true
        reason:
          type: string
          description: >
            Present only when `valid` is `false` and a specific reason exists. Absent on success and on bare 401 responses (no session cookie).
          example: "Session expired due to inactivity"
      required:
        - valid
    
    SuccessMessageResponse:
      type: object
      description: >
        Generic success response used by password reset and OTP endpoints.
      properties:
        success:
          type: boolean
          description: Always `true` when this schema is returned.
          example: true
        message:
          type: string
          description: Human-readable confirmation message.
          example: "Password has been reset successfully. You can now sign in with your new password."
      required:
        - success
        - message
    
    SuccessResponse:
      type: object
      description: >
        Returned when an operation completes successfully with no additional data.
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    ForgotPasswordRequest:
      type: object
      description: Request body for `POST /api/auth/forgot-password`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            The email address associated with the platform account. Automatically lowercased and trimmed before processing.
          example: "user@example.com"
      required:
        - email
    
    ResetPasswordRequest:
      type: object
      description: >
        Request body for `POST /api/auth/reset-password`.
      properties:
        token:
          type: string
          description: The JWT delivered via the reset email link. 
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        newPassword:
          type: string
          format: password
          description: >
            The new password. Must meet all of the following requirements:
              minimum 8 characters,
              at least one lowercase letter,
              at least one uppercase letter,
              at least one number.
          example: "NewsecureP@ss123"
      required:
        - token
        - newPassword

    StaffForgotPasswordRequest:
      type: object
      description: >
        Request body for `POST /api/auth/staff-forgot-password`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            The staff user's email address. Automatically lowercased and trimmed before processing.
          example: "staff@example.com"
        tenantSlug:
          type: string
          description: >
            The URL slug of the company the staff user belongs to. Used to scope the lookup to the correct tenant and to build
            the company-specific reset URL.
          example: "city-mart"
      required:
        - email
        - tenantSlug
    
    StaffResetPasswordRequest:
      type: object
      description: >
        Request body for `POST /api/auth/staff-reset-password`.
      properties:
        token:
          type: string
          description: >
            The JWT delivered via the staff reset email link.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        newPassword:
          type: string
          format: password
          description: >
            The new password. Must meet all of the following requirements:
              minimum 8 characters,
              at least one lowercase letter,
              at least one uppercase letter,
              at least one number.
          example: "NewSecureP@ss123"
      required:
        - token
        - newPassword
    
    TransferAuthRequest:
      type: object
      description: >
        Request body for `POST /api/account-auth/transfer`. 
        Either `tenantId` or `tenantSlug` must be provided — not both required, but at least one is mandatory.
      properties:
        tenantId:
          type: string
          format: uuid
          description: The UUID of the company to transfer into.
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        tenantSlug:
          type: string
          maxLength: 50
          description: The URL slug of the company to transfer into.
          example: "city-mart"
    
    TransferAuthResponse:
      type: object
      description: >
        Response containing the short-lived transfer token and the resolved company slug.
      properties:
        transferToken:
          type: string
          description: >
            A JWT signed with HS256 using `NEXTAUTH_SECRET`, valid for **30 seconds**.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        slug:
          type: string
          description: The resolved company URL slug.
          example: "city-mart"
      required:
        - transferToken
        - slug
    
    RegisterRequest:
      type: object
      description: >
        Request body for `POST /api/register`. 
        Creates a new platform account in the `accounts` table.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            The account owner's full display name. Whitespace-trimmed before storage
          example: "Jane Smith"
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Email address for the account. Automatically lowercased and trimmed. Must be unique across all accounts (`accounts.email` UNIQUE constraint).
          example: "jane@example.com"
        password:
          type: string
          format: password
          description: >
            Password for the account. Stored as bcrypt hash (cost factor 12). Must contain: minimum 8 characters, at least one lowercase letter, at least one uppercase letter, at least one number.
          example: "SecureP@ss123"
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: >
            ISO 3166-1 alpha-2 country code. Must be one of the 82 countries supported by this application — not all ISO codes are accepted. Determines the default currency stored in `accounts.currency`.
          example: "LK"
        phone:
          type: string
          description: >
            Mobile phone number. Normalized to digits-only with optional leading `+` before storage. Must contain 7-15 digits. Must be unique across all accounts (`accounts.phone` UNIQUE constraint).
          example: "+94771234567"
        verficationToken:
          type: string
          description: >
            Optional. JWT issued by the OTP verification flow.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tosAcceptedAt:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of when the user accepted the Terms of Service. Stored in `accounts.tos_accepted_at`. Required — must be a non-empty string.
          example: "2026-03-12T09:00:00.000Z"
      required:
        - fullName
        - email
        - password
        - country
        - phone
        - tosAcceptedAt
    
    RegisterResponse:
      type: object
      description: >
        Returned on successful account creation. Registration does **not** create a session — the user must sign in separately.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Account created successfully. Please sign in."
        accountId:
          type: string
          format: uuid
          description: >
            The UUID of the newly created account.
          example: "a1b2c3d4-5678-90ab-cdef-1234567890ab"
      required:
        - success
        - message
        - accountId
    
    CheckEmailRequest:
      type: object
      description: >
        Request body for `POST /api/register/check-email`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            The email address to check for availability. Automatically lowercased and trimmed before the lookup.
          example: "jane@example.com"
      required:
        - email
    
    CheckEmailResponse:
      type: object
      description: >
        Result of the email availability check.
      properties:
        available:
          type: boolean
          description: >
            `true` if the email address is not yet registered and may be used for a new account. `false` if the email is already taken.
          example: true
      required:
        - available
    
    SendOtpRequest:
      type: object
      description: >
        Request body for `POST /api/register/send-otp`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            The email address to send the OTP to. Automatically lowercased and trimmed before processing. Stored in `email_verification_otps.email`.
          example: "jane@example.com"
        type:
          type: string
          enum:
            - registration
            - password_reset
          description: >
            The verification purpose. Stored in `email_verification_otps.type`. Rate limits for `"registration"` and `"password_reset"` are tracked independently — reaching the limit for one does not affect the other. Defaults to `"registration"` if omitted.
          default: "registration"
          example: "registration"
      required:
        - email
    
    VerifyOtpRequest:
      type: object
      description: >
        Request body for `POST /api/register/verify-otp`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            The email address that received the OTP. Automatically lowercased and trimmed before lookup.
          example: "jane@example.com"
        otp:
          type: string
          minLength: 1
          description: >
            The 5-digit verification code received via email. The server compares this against the bcrypt hash stored in `email_verification_otps.otp_hash`.
          example: "47291"
        type:
          type: string
          enum:
            - registration
            - password_reset
          description: >
            The verification purpose. Must match the `type` used when calling `POST /api/register/send-otp`. A mismatched type will result in "No verification code found" even if a valid OTP exists for the other type. Defaults to `"registration"` if omitted.
          default: "registration"
          example: "registration"
      required:
        - email
        - otp
    
    VerifyOtpResponse:
      type: object
      description: >
        Returned on successful OTP verification.
      properties:
        success:
          type: boolean
          example: true
        verificationToken:
          type: string
          description: >
            A short-lived JWT (expires in **15 minutes**), signed with HS256 using `NEXTAUTH_SECRET`.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - success
        - verificationToken
    
    LookupTenantRequest:
      type: object
      description: >
        Request body for `POST /api/lookup-tenant`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            The email address to look up. Automatically lowercased and trimmed.
          example: "jane@example.com"
      required:
        - email
    
    TenantSummary:
      type: object
      description: >
        A minimal company record returned in the lookup response.
      properties:
        slug:
          type: string
          description: >
            The company's URL slug.
          example: "city-mart"
        name:
          type: string
          description: >
            The company's display name.
          example: "City Mart"
      required:
        - slug
        - name
    
    LookupTenantResponse:
      type: object
      description: >
        Response from `POST /api/lookup-tenant`. Always returns an array — empty if the email is not registered or has no active company memberships.
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
          description: >
            List of active companies associated with the email address. Deduplicated — a company appearing in both `account_tenants` and `users` tables is returned only once.
          example:
            - slug: "city-mart"
              name: "City Mart"
            - slug: "sunrise-cafe"
              name: "Sunrise Cafe"
      required:
        - tenants
    
    LookupTenantBySlugResponse:
      type: object
      description: >
        Response from `GET /api/lookup-tenant`. The `tenant` field is `null` if no active company exists for the given slug.
      properties:
        tenant:
          description: >
            The matched company object if found and active, or `null` if no active company exists for the given slug.
          properties:
            tenant:
              nullable: true
              description: >
                The matched company object if found and active, or `null` if no active company exists for the given slug.
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: The company's UUID.
                  example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                slug:
                  type: string
                  description: The company's URL slug.
                  example: "city-mart"
              required:
                - id
                - slug
          required:
            - tenant
    
    InviteTenantAssignment:
      type: object
      description: >
        A single company-role assignment included in the invite. Enriched with tenant data resolved from `staffInvites.tenant_assignments` jsonb.
      properties:
        tenantId:
          type: string
          format: uuid
          description: >
            The company's UUID. (`tenants.id`)
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        tenantName:
          type: string
          description: >
            The company's display name. Returns `"Unknown Company"` if the tenant record cannot be found.
          example: "City Mart"
        tenantSlug:
          type: string
          nullable: true
          description: >
            The company's URL slug. (`tenants.slug`) May be absent if the tenant record cannot be resolved.
          example: "city-mart"
        businessType:
          type: string
          nullable: true
          enum:
            - retail
            - restaurant
            - supermarket
            - auto_service
            - dealership
          description: >
            The company's business type. (`tenants.business_type`) May be absent if the tenant record cannot be resolved.
          example: "retail"
        role:
          allOf:
            - $ref: '#/components/schemas/UserRoleEnum'
          description: >
            The role the invitee will be assigned in this company upon acceptance. Maps to `user_role` enum. (`staff_invites.tenant_assignments[].role`)
      required:
        - tenantId
        - tenantName
        - role
      
    InviteDetailsResponse:
      type: object
      description: >
        Public details of a staff invite returned to the acceptance page.
      properties:
        email:
          type: string
          description: >
            The invite recipient's email address, **masked** for privacy.
            Format: first char + `***` + last char (local part) + `@domain`.
            Example: `"john.doe@example.com"` → `"j***e@example.com"`.
          example: "j***e@example.com"
        invitedBy:
          type: string
          description: >
            The full name of the account that sent this invite. Returns `"Someone"` if `invited_by` is null on the invite record, or if the inviter's account cannot be found.
          example: "Jane Smith"
        expiresAt:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of when this invite expires. (`staff_invites.expires_at`)
          example: "2026-03-23T09:00:00.000Z"
        tenantAssignments:
          type: array
          items:
            $ref: '#/components/schemas/InviteTenantAssignment'
          description: >
            List of company-role assignments included in this invite.
        hasExistingAccount:
          type: boolean
          description: >
            `true` if the invite recipient's email already has a registered platform account. Determines the acceptance flow — existing accounts do not need to provide `fullName` or `password`; new accounts do.
          example: false
      required:
        - email
        - invitedBy
        - expiresAt
        - tenantAssignments
        - hasExistingAccount
    
    AcceptInviteRequest:
      type: object
      description: >
        Request body for `POST /api/invites/{token}/accept`. Field requirements depend on whether the invitee already has a platform account. Check `hasExistingAccount` from `GET /api/invites/{token}` before submitting.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            **Required only when `hasExistingAccount` is `false`.** The new staff member's display name. Whitespace-trimmed before storage. Ignored when the invitee already has a platform account.
          example: "John Smith"
        password:
          type: string
          format: password
          description: >
            **Required only when `hasExistingAccount` is `false`.** Password for the new staff account. Stored as bcrypt hash (cost 12).
            Must contain: 
              minimum 8 characters, 
              at least one lowercase letter,
              at least one uppercase letter, 
              at least one number.
            Ignored when the invitee already has a platform account.
          example: "SecureP@ss123"
    
    AcceptedTenantDetail:
      type: object
      description: >
        A company the invite has been granted access to upon accepting the invite.
      properties:
        tenantId:
          type: string
          format: uuid
          description: The company's UUID. (`tenants.id`)
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        tenantName:
          type: string
          description: >
            The company's display name. Returns `"Unknown"` if the tenant record cannot be resolved.
          example: "City Mart"
        tenantSlug:
          type: string
          nullable: true
          description: >
            The company's URL slug. (`tenants.slug`) May be absent if the tenant record cannot be resolved.
          example: "city-mart"
        role:
          allOf:
            - $ref: '#/components/schemas/UserRoleEnum'
          description: >
            The role assigned to the invitee in this company. Maps to `user_role` enum. (`account_tenants.role` or `users.role`)
      required:
        - tenantId
        - tenantName
        - role
    
    AcceptInviteResponse:
      type: object
      description: >
        Returned on successful invite acceptance.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Invite accepted successfully"
        email:
          type: string
          format: email
          description: >
            The invitee's **full** (unmasked) email address. Unlike `GET /api/invites/{token}` which returns a masked email, the acceptance response reveals the full email since the invite has been consumed.
          example: "john.smith@example.com"
        companies:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedTenantDetail'
          description: >
            List of companies the invitee now has access to.
      required:
        - success
        - message
        - email
        - companies

    UserWarehouseAssignment:
      type: object
      description: >
        A warehouse assignment for a staff user.
      properties:
        warehouseId:
          type: string
          format: uuid
          example: "d4e5f6a7-8901-2345-bcde-f01234567890"
        warehouse:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "d4e5f6a7-8901-2345-bcde-f01234567890"
            name:
              type: string
              example: "Main Warehouse"
            code:
              type: string
              example: "WH-001"
            isDefault:
              type: boolean
              example: true
          required: 
            - id
            - name
            - code
            - isDefault
      required: 
        - warehouseId
        - warehouse
    
    UserListItem:
      type: object
      description: >
        A staff user record returned in the list response. `passwordHash` is never included.
      properties:
        id:
          type: string
          format: uuid
          example: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
        email:
          type: string
          format: email
          example: "john@example.com"
        fullName:
          type: string
          example: "John Smith"
        role:
          allOf:
            - $ref: '#/components/schemas/UserRoleEnum'
          description: The staff role assigned to this user.
        isActive:
          type: boolean
          example: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-25T09:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-01T00:00:00.000Z"
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/UserWarehouseAssignment'
          description: >
            Only present when `includeWarehouses=true` was passed.
      required: 
        - id
        - email
        - fullName
        - role
        - isActive
        - createdAt
        - updatedAt
    
    CreateUserRequest:
      type: object
      description: >
        Request body for `POST /api/users`.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Email address of the user to add or invite. Automatically lowercased and trimmed. `owner` role cannot be assigned — use the account dashboard instead.
          example: "john@example.com"
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRoleEnum'
          description: >
            Role to assign. `owner` is explicitly rejected. Callers cannot assign a role higher than their own level.
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Optional list of warehouse UUIDs to assign the new user to. Only applies when the user is added immediately (mode `"added"`). Ignored in invite flow.
          example: ["d4e5f6a7-8901-2345-bcde-f01234567890"]
      required:
        - email
        - role
    
    AddedUserResponse:
      type: object
      description: >
        Returned when the invitee already has a platform account and was added to the tenant immediately.
      properties:
        mode:
          type: string
          enum: ["added"]
          example: "added"
        user:
          $ref: '#/components/schemas/UserListItem'
      required: 
        - mode
        - user
    
    InvitedUserResponse:
      type: object
      description: >
        Returned when the invitee does not have a platform account and a staff invite was created and emailed to them.
      properties:
        mode:
          type: string
          enum: ["invited"]
          example: "invited"
        invite:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "f6a7b8c9-0123-4567-def0-123456789012"
            email:
              type: string
              format: email
              example: "john@example.com"
            role:
              type: string
              example: "cashier"
            expiresAt:
              type: string
              format: date-time
              example: "2026-04-01T09:00:00.000Z"
            inviteUrl:
              type: string
              description: >
                The URL sent to the invitee. 
                Format:
                  `{NEXTAUTH_URL}/invite/{token}`
              example: "https://example.app.retailsmarterp.com/invite/abc123..."
          required: [id, email, role, expiresAt, inviteUrl]
      required: 
        - mode
        - invite
    
    UpdateUserRequest:
      type: object
      description: >
        Request body for `PUT /api/users/{id}`. All fields are optional — only provided fields are updated. Includes optimistic locking via `expectedUpdatedAt`.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            The user's display name. Whitespace-trimmed.
          example: "Jane Smith"
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Updated email address. Must be unique within the tenant. Lowercased and trimmed automatically.
          example: "jane@example.com"
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRoleEnum'
          description: >
            Updated role. `owner` cannot be assigned via this endpoint. Callers cannot assign a role above their own level. A user cannot change their own role.
        isActive:
          type: boolean
          description: >
            Updated active status. A user cannot change their own status. When changed and the user has a linked platform account (`users.account_id`), `account_tenants.is_active` is also updated in the same transaction.
          example: true
        password:
          type: string
          format: password
          description: >
            New password. Must contain: minimum 8 characters, at least one lowercase letter, at least one uppercase letter, at least one number. Stored as bcrypt hash (cost factor 12).
          example: "NewP@ss1"
        expectedUpdatedAt:
          type: string
          format: date-time
          description: >
            Optimistic lock timestamp. If the server record's `updated_at` is newer than this value, HTTP 409 is returned with `code: "CONFLICT"`. The client should refresh the record and retry.
          example: "2026-03-25T09:00:00.000Z"
    
    ConflictErrorResponse:
      type: object
      description: >
        Returned when optimistic locking detects a concurrent modification.
      properties:
        error:
          type: string
          description: Human-readable conflict message.
          example: "This user was modified by another user. Please refresh and try again."
        code:
          type: string
          enum:
            - CONFLICT
          description: >
            Machine-readable conflict code. Always `"CONFLICT"` on HTTP 409.
          example: "CONFLICT"
      required:
        - error
        - code
    
    WarehouseDetail:
      type: object
      description: >
        A warehouse record embedded inside an assignment.
      properties:
        id:
          type: string
          format: uuid
          example: "d4e5f6a7-8901-2345-bcde-f01234567890"
        name:
          type: string
          example: "Main Warehouse"
        code:
          type: string
          example: "WH-001"
        isDefault:
          type: boolean
          example: true
      required:
        - id
        - name
        - code
        - isDefault
    
    UserWarehouseRecord:
      type: object
      description: >
        A single `user_warehouses` record with the full warehouse object.
      properties:
        id:
          type: string
          format: uuid
          example: "d0e1f2a3-4567-8901-1234-567890123456"
        userId:
          type: string
          format: uuid
          example: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
        warehouseId:
          type: string
          format: uuid
          example: "d4e5f6a7-8901-2345-bcde-f01234567890"
        isActive:
          type: boolean
          example: true
        warehouse:
          $ref: '#/components/schemas/WarehouseDetail'
      required:
        - id
        - userId
        - warehouseId
        - isActive
        - warehouse

    PosProfileWarehouseAssignment:
      type: object
      description: >
        A `pos_profile_users` record including the POS profile and its linked warehouse.
      properties:
        id:
          type: string
          format: uuid
          example: "f2a3b4c5-6789-0123-3456-789012345678"
        userId:
          type: string
          format: uuid
          example: "u1b2c3d4-5678-90ab-cdef-1234567890ab"
        posProfileId:
          type: string
          format: uuid
          example: "e1f2a3b4-5678-9012-2345-678901234567"
        posProfile:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "e1f2a3b4-5678-9012-2345-678901234567"
            name:
              type: string
              example: "Counter 1"
            warehouse:
              $ref: '#/components/schemas/WarehouseDetail'
          required:
            - id
            - name
      required:
        - id
        - userId
        - posProfileId
        - posProfile
    
    UserWarehouseAssignmentsResponse:
      type: object
      description: >
        Current warehouse and POS profile assignments for a staff user.
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/UserWarehouseRecord'
          description: >
            Active `user_warehouses` records for this user.
        posProfileAssignments:
          type: array
          items:
            $ref: '#/components/schemas/PosProfileWarehouseAssignment'
          description: >
            POS profile assignments for this user, each including the POS profile's linked warehouse.
      required:
        - assignments
        - posProfileAssignments
    
    UpdateUserWarehousesRequest:
      type: object
      description: >
        Request body for `PUT /api/users/{id}/warehouses`.
        Represents the **complete desired state** — existing assignments not in this list are removed, and IDs not currently assigned are added. An empty array removes all warehouse assignments.
      properties:
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            The complete list of warehouse UUIDs to assign to this user. All provided IDs must exist as warehouses in the current tenant.
          example:
            - "d4e5f6a7-8901-2345-bcde-f01234567890"
            - "d4e5f6a7-8901-2345-bcde-f01234567891"
      required:
        - warehouseIds
    
    UpdateUserWarehousesResponse:
      type: object
      description: >
        Returned after a successful warehouse assignment update.
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/UserWarehouseRecord'
          description: >
            The full updated list of warehouse assignments.
        added:
          type: integer
          description: Number of new assignments created.
          example: 1
        removed:
          type: integer
          description: Number of assignments removed.
          example: 0
      required:
        - assignments
        - added
        - removed
    
    PendingInviteItem:
      type: object
      description: >
        A staff invite record enriched with this tenant's role and computed status. Includes both pending and expired invites.
      properties:
        id:
          type: string
          format: uuid
          description: Invite UUID. (`staff_invites.id`)
          example: "f6a7b8c9-0123-4567-def0-123456789012"
        email:
          type: string
          format: email
          description: Email address the invite was sent to. (`staff_invites.email`)
          example: "john@example.com"
        role:
          type: string
          description: >
            The role assigned to this invitee for the current tenant, extracted from `tenant_assignments`. Returns `"unknown"` if the assignment cannot be resolved.
          example: "cashier"
        expiresAt:
          type: string
          format: date-time
          description: When the invite expires. (`staff_invites.expires_at`)
          example: "2026-04-01T09:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          description: When the invite was created. (`staff_invites.created_at`)
          example: "2026-03-25T09:00:00.000Z"
        status:
          type: string
          enum:
            - pending
            - expired
          description: >
            `"pending"` if `expires_at` is in the future; `"expired"` otherwise. Both are included in the response — not filtered out.
          example: "pending"
      required:
        - id
        - email
        - role
        - expiresAt
        - createdAt
        - status

    ResendInviteResponse:
      type: object
      description: >
        Returned after a successful invite resend. The expiry is always set to 7 days from the time of this request.
      properties:
        success:
          type: boolean
          example: true
        expiresAt:
          type: string
          format: date-time
          description: >
            The new expiry timestamp — 7 days from the time of this request. (`staff_invites.expires_at`)
          example: "2026-04-01T09:00:00.000Z"
      required:
        - success
        - expiresAt
    
    CustomRolePermissions:
      type: object
      description: >
        A map of permission keys to granted (`true`) or denied (`false`) values. Only explicitly set permissions appear. Absent keys fall back to the `baseRole` system defaults.
      additionalProperties:
        type: boolean
      example:
        manageItems: true
        viewReports: false
        createSales: true
    
    CustomRoleItem:
      type: object
      description: >
        A custom role record with its resolved permission overrides.
      properties:
        id:
          type: string
          format: uuid
          description: Custom role UUID. (`custom_roles.id`)
          example: "e5f6a7b8-9012-3456-cdef-012345678901"
        tenantId:
          type: string
          format: uuid
          description: The tenant this role belongs to.
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        name:
          type: string
          description: Human-readable role name. (`custom_roles.name`)
          example: "Senior Cashier"
        slug:
          type: string
          description: >
            URL-safe identifier auto-generated from `name`.
            Pattern: lowercase alphanumeric + underscores, max 50 chars.
          example: "senior_cashier"
        baseRole:
          type: string
          description: >
            The built-in role this custom role inherits default permissions from. Cannot be `"owner"`.
          example: "cashier"
        description:
          type: string
          nullable: true
          description: Optional description of this custom role.
          example: "Cashier with additional inventory view access"
        color:
          type: string
          nullable: true
          description: >
            Optional display color in hex format (`#RRGGBB`).
          example: "#3b82f6"
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: UUID of the user who created this role.
          example: "f2a3b4c5-6789-0123-3456-789012345678"
        createdAt:
          type: string
          format: date-time
          example: "2026-03-25T09:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-25T09:00:00.000Z"
        permissions:
          $ref: '#/components/schemas/CustomRolePermissions'
      required:
        - id
        - tenantId
        - name
        - slug
        - baseRole
        - permissions
    
    CreateCustomRoleRequest:
      type: object
      description: >
        Request body for `POST /api/custom-roles`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Human-readable role name. A URL-safe slug is auto-generated from this value. Must produce a non-empty slug after normalization.
          example: "Senior Cashier"
        baseRole:
          allOf:
            - $ref: '#/components/schemas/AssignableRoleEnum'
          description: >
            Built-in role to inherit default permissions from. `"owner"` is not allowed.
        description:
          type: string
          maxLength: 500
          description: Optional description of this role's purpose.
          example: "Cashier with additional inventory view access"
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: >
            Optional display color in hex format (`#RRGGBB`).
          example: "#3b82f6"
        permissions:
          allOf:
            - $ref: '#/components/schemas/CustomRolePermissions'
          description: >
            Optional map of permission keys to grant or deny. Unknown permission keys are silently ignored. Owner-only permissions (`manageTenant`, `manageModuleAccess`) cannot be granted and are silently ignored even if set to `true`.
      required:
        - name
        - baseRole

    UpdateCustomRoleRequest:
      type: object
      description: >
        Request body for `PUT /api/custom-roles/{id}`. All fields are optional — only provided fields are updated. `description` and `color` accept `null` to clear the value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Updated display name. A new slug is automatically regenerated from this value using the same algorithm as creation.
          example: "Front Counter Staff"
        baseRole:
          allOf:
            - $ref: '#/components/schemas/AssignableRoleEnum'
          description: >
            Updated base role for permission inheritance. `"owner"` is not allowed.
        description:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Updated description. Pass `null` to clear the existing value.
          example: "Counter staff with limited inventory access"
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
          description: >
            Updated display color in hex format. Pass `null` to clear.
          example: "#10b981"
        isActive:
          type: boolean
          description: Whether this custom role is active.
          example: true
        permissions:
          allOf:
            - $ref: '#/components/schemas/CustomRolePermissions'
          description: >
            Full replacement permissions map.
    
    BuiltinRoleOverrides:
      type: object
      description: >
        A map of built-in role names to their tenant-specific permission overrides. Only roles that have at least one override appear as keys. Only entries that differ from the system default are stored — absent keys inherit the system default.
      additionalProperties:
        type: object
        additionalProperties:
          type: boolean
      example:
        manager:
          voidSales: false
          viewReports: true
        cashier:
          createSales: false
    
    SystemDefaults:
      type: object
      description: >
        The application's built-in permission defaults. Each key is a permission name; the value is the list of built-in roles that have that permission by default. Combine with `builtinOverrides` to determine a role's effective permissions.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        manageSettings:
          - owner
          - system_manager
        manageUsers:
          - owner
          - manager
          - system_manager
        createSales:
          - owner
          - manager
          - cashier
          - waiter
          - sales_manager
          - dealer_sales
          - pos_user

    RolePermissionsResponse:
      type: object
      description: >
        Full permission configuration for the tenant — builtin overrides, custom role permissions, and the system defaults all in one response.
      properties:
        builtinOverrides:
          allOf:
            - $ref: '#/components/schemas/BuiltinRoleOverrides'
          description: >
            Tenant-specific overrides for built-in roles. Only entries that differ from `systemDefaults` are stored here.
        customRoles:
          type: array
          description: >
            All custom roles for this tenant, each with their explicit permission overrides as a `permissions` map.
          items:
            $ref: '#/components/schemas/CustomRoleItem'
        systemDefaults:
          allOf:
            - $ref: '#/components/schemas/SystemDefaults'
          description: >
            The application's built-in permission defaults (`ROLE_PERMISSIONS`). Keys are permission names; values are arrays of built-in role names that have each permission by default.
      required:
        - builtinOverrides
        - customRoles
        - systemDefaults
    
    UpdateRolePermissionsRequest:
      type: object
      description: >
        Request body for `PUT /api/role-permissions`. Replaces all permission overrides for the specified built-in role.
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRoleEnum'
          description: >
            The built-in role to update overrides for. `"owner"` is not allowed.
        overrides:
          type: object
          additionalProperties:
            type: boolean
          description: >
            Map of permission keys to `true` (grant) or `false` (deny). 
            All keys must be valid permission names from `systemDefaults`.
            Unknown keys return HTTP 400.
            Owner-only permissions (`manageTenant`, `manageModuleAccess`) cannot be granted — returns HTTP 400 if set to `true`.
            Overrides that match the system default are not stored (no-op).
          example:
            createSales: true
            voidSales: false
            viewReports: true
      required:
        - role
        - overrides
    
    EffectivePermissionsMap:
      type: object
      description: >
        A complete map of every permission key to its effective value (`true` or `false`) for the requesting user.
        All keys from the application's `ROLE_PERMISSIONS` constant are present.
        No key is absent — a missing key always means `false` should not be assumed.
      additionalProperties:
        type: boolean
      example:
        manageSettings: false
        manageTenant: false
        manageModuleAccess: false
        manageUsers: true
        manageItems: false
        createSales: true
        voidSales: false
        viewReports: false
        managePurchases: false
        manageCustomers: true

    EffectivePermissionsResponse:
      type: object
      description: >
        Response from `GET /api/role-permissions/effective`.
      properties:
        permissions:
          allOf:
            - $ref: '#/components/schemas/EffectivePermissionsMap'
          description: >
            The complete effective permissions for the requesting user.
            Computed by evaluating the user's role, tenant-specific permission overrides, and custom role (if assigned) in that priority order.
            `owner` always has all permissions set to `true`.
      required:
        - permissions
    
    ResetRolePermissionsRequest:
      type: object
      description: >
        Request body for `POST /api/role-permissions/reset`.
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRoleEnum'
          description: >
            The built-in role to reset to system defaults. `"owner"` is not allowed — owner permissions cannot be modified.
      required:
        - role
    
    ModuleAccessRecord:
      type: object
      description: >
        A single `module_access` record defining whether a specific role can access a specific module for this tenant.
      properties:
        id:
          type: string
          format: uuid
          description: Record UUID. (`module_access.id`)
          example: "c9d0e1f2-3456-7890-0123-456789012345"
        tenantId:
          type: string
          format: uuid
          description: The tenant this record belongs to.
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        moduleKey:
          type: string
          description: >
            Identifier for the module (e.g., `"pos"`, `"inventory"`, `"reports"`).
            Max 100 characters.
          example: "pos"
        role:
          type: string
          description: >
            The staff role this record applies to.
          example: "cashier"
        isEnabled:
          type: boolean
          description: >
            Whether this role has access to this module.
          example: true
        updatedBy:
          type: string
          format: uuid
          nullable: true
          description: UUID of the user who last updated this record.
          example: "f2a3b4c5-6789-0123-3456-789012345678"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-25T09:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-03-25T09:00:00.000Z"
      required:
        - id
        - tenantId
        - moduleKey
        - role
        - isEnabled
    
    ModuleAccessEntry:
      type: object
      description: >
        A single upsert entry for `PUT /api/module-access`.
      properties:
        moduleKey:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Identifier of the module to configure.
          example: "pos"
        role:
          type: string
          minLength: 1
          maxLength: 50
          description: >
            The staff role to configure access for.
          example: "cashier"
        isEnabled:
          type: boolean
          description: >
            Whether to enable or disable access for this role + module combination.
          example: true
      required:
        - moduleKey
        - role
        - isEnabled
    
    UpdateModuleAccessRequest:
      type: object
      description: >
        Request body for `PUT /api/module-access`.
        Contains one or more entries to upsert. Each entry is processed individually — existing records are updated, new combinations are inserted.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAccessEntry'
          minItems: 1
          maxItems: 500
          description: >
            Array of module access entries to upsert. Minimum 1, maximum 500 entries per request.
      required:
        - entries
    
    ActiveSessionRecord:
      type: object
      description: >
        A single active session record for a platform account.
        `sessionToken` is never included in the response.
      properties:
        id:
          type: string
          format: uuid
          description: Session UUID. (`account_sessions.id`)
          example: "a7b8c9d0-1234-5678-ef01-234567890123"
        scope:
          type: string
          enum:
            - account
            - company
          description: >
            Whether this session is a platform-level (`account`) or company-context (`company`) session.
          example: "account"
        tenantSlug:
          type: string
          nullable: true
          description: >
            The tenant slug if this is a `company`-scoped session.
            `null` for `account`-scoped sessions.
          example: "my-company"
        ipAddress:
          type: string
          nullable: true
          description: IP address recorded at session creation.
          example: "203.0.113.42"
        deviceName:
          type: string
          nullable: true
          description: >
            Human-readable device name parsed from the User-Agent at login.
            Format: `"Browser on OS"` (e.g., `"Chrome on Windows"`).
          example: "Chrome on Windows"
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Last time this session was touched (via heartbeat).
          example: "2026-03-25T08:55:00.000Z"
        createdAt:
          type: string
          format: date-time
          description: When this session was created (login time).
          example: "2026-03-25T09:00:00.000Z"
        expiresAt:
          type: string
          format: date-time
          description: >
            When this session expires. Extended by 24 hours on each heartbeat touch.
          example: "2026-03-26T09:00:00.000Z"
        isCurrent:
          type: boolean
          description: >
            `true` if this is the session making the current request.
            Used by clients to identify their own session in the list.
          example: true
      required:
        - id
        - scope
        - isCurrent
    
    ActiveSessionsResponse:
      type: object
      description: >
        Response from `GET /api/account/sessions`.
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSessionRecord'
          description: >
            All active (non-revoked, non-expired) sessions for the account, ordered by `lastActivityAt` descending.
            Excludes revoked sessions and sessions past their `expiresAt`.
      required:
        - sessions

