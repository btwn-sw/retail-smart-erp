        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                error: "Failed to delete custom role"

  # ---- /role-permissions ----
  /role-permissions:
    get:
      tags:
        - Authentication
      summary: Get all role permission overrides
      operationId: getRolePermissions
      description: >
        Returns the full permission state for the tenant in three sections: builtinOverrides, customRoles, and systemDefaults.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Role permissions returned sccussfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
              example:
                builtinOverrides:
                  manager:
                    viewReports: false
                  cashier:
                    manageInventory: true 
                customRoles:
                  - id: "cr_01ABC123"
                    name: "Front Counter Staff"
                    slug: "front_counter_staff"
                    baseRole: "cashier"
                    description: "Staff assigned to the front counter only"
                    color: "#FF5733"
                    isActive: "true"
                    permissions:
                      viewReports: true
                      manageInventory: false
                systemDefaults:
                  viewReports: ["owner", "manager"]
                  manageInventory: ["owner", "manager", "technician"]
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                error: "Unauthorized"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                error: "Failed to fetch role permissions"
    put:
      tags:
        - Authentication
      summary: Update built-in permission overrides
      operationId: updateRolePermissions
      description: >
        Replaces permission overrides for a single built-in role.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
            example:
              role: "manager"
              overrides:
                viewReports: true
                managerInventory: false
      responses:
        '200':
          description: Permission overrides updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSuccessResponse'
              example:
                success: true
        '400':
          description: >
            role is 'owner', permission key is invalid, or owner-only permission was granted to a non-owner role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ownerRole:
                  summary: Cannot modify owner permissions
                  value:
                    error: "Owner permissions cannot be modified"
                invalidKey:
                  summary: Unknown permission key
                  value:
                    error: "Invalid permission: someUnknownKey"
                ownerOnlyPermission:
                  summary: Owner-only permission granted to non-owner
                  value:
                    error: "Permission \"manageOwners\" can only be assigned to owners"
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '422':
          description: Request body failed schema validation.
