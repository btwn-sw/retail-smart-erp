  /api/account/companies/check-slug:
    get:
      tags:
        - Account & Company
      summary: Check business code (slug) availability
      description: >
        Checks whether a business code (slug) is available for use as a company identifier.
      operationId: checkCompanySlug
      security:
        - accountCookieAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          description: >
            Business code to check. Automatically lowercased and trimmed server-side.
          schema:
            type: string
            example: "sunrise-retail"
      responses:
        '200':
          description: >
            Slug check completed. Inspect `available` to determine the result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCheckResponse'
              examples:
                available:
                  summary: Slug is available
                  value:
                    available: true
                formatError:
                  summary: Format validation failed
                  value:
                    available: false
                    reason: "Must start and end with a letter or number"
                characterError:
                  summary: Invalid characters
                  value:
                    available: false
                    reason: "Only lowercase letters, numbers, and hyphens allowed"
                tooShort:
                  summary: Too short
                  value:
                    available: false
                    reason: "Must be at least 3 characters"
                tooLong:
                  summary: Too long
                  value:
                    available: false
                    reason: "Must be 25 characters or less"
                reserved:
                  summary: Reserved business code
                  value:
                    available: false
                    reason: "This code is reserved"
                alreadyTaken:
                  summary: Slug already in use by an active company
                  value:
                    available: false
                    reason: "Already taken"
                pendingReserved:
                  summary: Slug reserved by a pending company
                  value:
                    available: false
                    reason: "Reserved by a pending company"
        '400':
          description: >
            The `slug` query parameter was not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Slug is required"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
  
