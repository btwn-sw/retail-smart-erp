                error: "Unauthorized"
        '403':
          description: Not the billing account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Not authorized"
        '404':
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Subscription not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    error: "Internal server error"
                tierMissing:
                  value:
                    error: "Current tier not found"
  
  /api/account/messages:
    get:
      tags:
        - Account & Company
      summary: List conversation
      description: >
        Returns a paginzted list of conversations for the authenticated account, ordered by last message date descending.
      operationId: listAccountConversation
      security:
        - accountCookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: status
          in: query
          required: false
          description: >
            Filter by conversation status. Omit or pass `all` for no filter.
          schema:
            type: string
            enum: [open, closed, archived, all]
            example: "open"
      responses:
        '200':
          description: Conversations retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
              example:
                data:
                  - id: "k2l3m4n5-o6p7-8901-q234-567890123456"
                    accountId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    subject: "Billing question for March"
                    status: "open"
                    priority: "normal"
                    category: "billing"
                    lastMessageAt: "2026-03-29T10:00:00.000Z"
                    lastMessagePreview: "I have a question about my March invoice..."
                    unreadByAccount: false
                    unreadByAdmin: true
                    closedAt: null
                    closedBy: null
                    createdAt: "2026-03-29T10:00:00.000Z"
                    updatedAt: "2026-03-29T10:00:00.000Z"
                pagination:
                  page: 1
                  pageSize: 20
                  total: 1
                  totalPages: 1
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Invalid query paramters"
                details:
                  - field: "page"
                    message: "Expected integer, received string"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"
    post:
      tags:
        - Account & Company
      summary: Create a new conversation
      description: >
        Creates a new support conversation with an initial message.
      operationId: createAccountConversation
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
            example:
              subject: "Billing question for March"
              message: "I have a question about my March invoice..."
              category: "general"
              priority: "normal"
      responses:
        '201':
          description: Conversation and initial message created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
              example:
                conversation:
                  id: "k2l3m4n5-o6p7-8901-q234-567890123456"
                  accountId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  subject: "Billing question for March"
                  status: "open"
                  priority: "normal"
                  category: "billing"
                  lastMessageAt: "2026-03-29T10:00:00.000Z"
                  lastMessagePreview: "I have a question about my March invoice..."
                  unreadByAccount: false
                  unreadByAdmin: true
                  closedAt: null
                  closedBy: null
                  createdAt: "2026-03-29T10:00:00.000Z"
                  updatedAt: "2026-03-29T10:00:00.000Z"
                message:
                  id: "l3m4n5o6-p7q8-9012-r345-678901234567"
                  conversationId: "k2l3m4n5-o6p7-8901-q234-567890123456"
                  senderType: "account"
                  senderId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  senderName: "John Smith"
                  content: "I have a question about my March invoice..."
                  metadata: {}
                  isSystemMessage: false
                  readAt: null
                  createdAt: "2026-03-29T10:00:00.000Z"
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "subject"
                    message: "Subject is required"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"














components:
  securitySchemes:
    # ---- auth ----
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >
        Session cookie set by NextAuth.js upon login. Required for all tenant-scoped staff operations.

    # ---- account-auth ----
    accountCookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >
        Session cookie issued by the **account-auth** NextAuth.js instance (`/account-auth/`). Used to authenticate platform account owners and managers.
  
  schemas:
    # ---- Enums ----
    UserRoleEnum:
      type: string
      description: >
        All valid staff role values including `owner`.
      enum:
        - owner
        - manager
        - cashier
        - technician
        - chef
        - waiter
        - system_manager
        - accounts_manager
        - sales_manager
        - purchase_manager
        - hr_manager
        - stock_manager
        - pos_user
        - report_user
        - dealer_sales
      example: "cashier"

    # AssignableRoleEnum:
    #   type: string
    #   description: >
    #     Staff roles assignable via API. Excludes `owner` — owner role can only be assigned through the account dashboard.
    #   enum:
    #     - manager
    #     - cashier
    #     - technician
    #     - chef
    #     - waiter
    #     - system_manager
    #     - accounts_manager
    #     - sales_manager
    #     - purchase_manager
    #     - hr_manager
    #     - stock_manager
    #     - pos_user
    #     - report_user
    #     - dealer_sales
    #   example: "cashier"
    
    # ---- Error Responses ----
    ValidationErrorResponse:
      type: object
      description: >
        Returned when validateBody() fails schema validation.
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "Invalid email format"
      required:
        - error
        - details
    
    # ---- Common ----
    SuccessResponse:
      type: object
      description: >
        Generic success response.
      properties:
        success:
          type: boolean
          example: true
      required:
        - success
    
    ErrorResponse:
      type: object
      description: Generic error response.
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "Unauthorized"
      required:
        - error
    
    CodedErrorResponse:
      type: object
      description: >
        Error response with a machine-readable code field.
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "Incorrect password"
        code:
          type: string
          description: >
            Machine-readable error code for client-side handling.
          example: "INCORRECT_PASSWORD"
      required:
        - error
        - code

    # ---- Account ----
    AccountProfile:
      type: object
      description: Account owner profile.
      properties:
        id:
          type: string
          format: uuid
          description: Unique account ID.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        email:
          type: string
          format: email
          description: Account owner email address.
          example: "owner@example.com"
        fullName:
          type: string
          description: Account owner's full name.
          example: "Jane Smith"
        phone:
          type: string
          description: >
            Phone number. Unique across all accounts.
          example: "+94771234567"
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: "LK"
        currency:
          type: string
          description: ISO 4217 3-letter currency code.
          example: "LKR"
      required:
        - id
        - email
        - fullName
        - phone
        - country
        - currency
    
    UpdatedAccountRequest:
      type: object
      description: >
        Request body for updating account profile. Only `fullName` and `phone` are accepted.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Account owner's full name. Leading and trailing whitespace is trimmed server-side.
          example: "Jane Smith"
        phone:
          type: string
          description: >
            Phone number. Must be unique across all accounts.
            If omitted, the existing phone value is preserved.
          example: "+94771234567"
      required:
        - fullName
    
    AccountPreferences:
      type: object
      description: >
        Account preferences returned by GET and PUT /api/account/preferences.
      properties:
        language:
          type: string
          description: Preferred language code.
          example: "en"
        timezone:
          type: string
          description: Preferred timezone.
          example: "Asia/Colombo"
        dateFormat:
          type: string
          description: Preferred date format.
          example: "DD/MM/YYYY"
        currency:
          type: string
          description: >
            ISO 4217 3-letter currency code.
          example: "LKR"
        theme:
          type: string
          enum: [light, dark, system]
          description: UI theme preference.
          example: "system"
        notifications:
          type: object
          description: >
            Notification preferences. Each sub-field is independently updatable.
          properties:
            email:
              type: boolean
              description: Email notifications enabled.
              example: true
            billing:
              type: boolean
              description: Billing notifications enabled.
              example: true
            security:
              type: boolean
              description: Security notifications enabled.
              example: true
            marketing:
              type: boolean
              description: Marketing notifications enabled.
              example: false
          required:
            - email
            - billing
            - security
            - marketing
      required:
        - language
        - timezone
        - dateFormat
        - currency
        - theme
        - notifications
    
    UpdatePreferencesRequest:
      type: object
      description: >
        Request body for PUT /api/account/preferences.
        All fields are optional — only include fields you want to change.
        Omitted fields preserve their existing values.
        An empty object {} is valid and only updates `updatedAt`.
      properties:
        language:
          type: string
          maxLength: 10
          description: Preferred language code.
          example: "en"
        timezone:
          type: string
          maxLength: 100
          description: Preferred timezone.
          example: "Asia/Colombo"
        dateFormat:
          type: string
          maxLength: 50
          description: Preferred date format string.
          example: "DD/MM/YYYY"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: >
            ISO 4217 3-letter currency code. Must be exactly 3 characters.
          example: "LKR"
        theme:
          type: string
          enum: [light, dark, system]
          description: UI theme preference.
          example: "system"
        notifications:
          type: object
          description: >
            Notification preferences. Send only the sub-fields you want to change.
          properties:
            email:
              type: boolean
              description: Email notifications enabled.
              example: true
            billing:
              type: boolean
              description: Billing notifications enabled.
              example: true
            security:
              type: boolean
              description: Security notifications enabled.
              example: true
            marketing:
              type: boolean
              description: Marketing notifications enabled.
              example: false

    CompanySubscriptionSummary:
      type: object
      description: >
        Subscription summary for a company. Null if no subscription exists.
      nullable: true
      properties:
        status:
          type: string
          enum: [trial, active, past_due, cancelled, locked]
          description: Current subscription status.
          example: "trial"
        tierName:
          type: string
          nullable: true
          description: Display name of the pricing tier.
          example: "Professional"
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
          description: Trial expiry timestamp. Null if not a trial subscription.
          example: "2026-04-15T00:00:00.000Z"
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: Current billing period end timestamp.
          example: "2026-04-30T00:00:00.000Z"
      required:
        - status

    CompanyUsageSummary:
      type: object
      description: >
        Storage usage summary for a company. Null if usage data unavailable.
      nullable: true
      properties:
        databaseBytes:
          type: integer
          description: Database storage used in bytes.
          example: 0
        fileStorageBytes:
          type: string
          description: File storage (R2) used in bytes.
          example: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Last time usage was updated.
          example: "2026-03-26T00:00:00.000Z"
      required:
        - databaseBytes
        - fileStorageBytes

    CompanyLimits:
      type: object
      description: >
        Storage limits from pricing tier (in bytes). Null if no tier assigned.
      properties:
        maxDatabaseBytes:
          type: string
          nullable: true
          description: Maximum database storage in bytes.
          example: null
        maxFileStorageBytes:
          type: integer
          nullable: true
          description: Maximum file storage in bytes.
          example: null
      required:
        - maxDatabaseBytes
        - maxFileStorageBytes

    CompanyListItem:
      type: object
      description: A single company entry.
      properties:
        id:
          type: string
          format: uuid
          description: Tenant unique identifier.
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        name:
          type: string
          maxLength: 255
          description: Company display name.
          example: "Sunrise Retail"
        slug:
          type: string
          maxLength: 100
          description: Unique business code used as subdomain.
          example: "sunrise-retail"
        businessType:
          type: string
          enum: [retail, restaurant, supermarket, auto_service, dealership]
          description: Business type.
          example: "retail"
        logoUrl:
          type: string
          nullable: true
          description: Company logo URL.
          example: null
        status:
          type: string
          enum: [active, suspended, cancelled, locked]
          description: Tenant status.
          example: "active"
        phone:
          type: string
          maxLength: 50
          nullable: true
          description: Company phone number.
          example: "+94112345678"
        address:
          type: string
          nullable: true
          description: Company address.
          example: "123 Main St, Colombo"
        email:
          type: string
          format: email
          maxLength: 255
          description: Company email.
          example: "info@sunrise.lk"
        currency:
          type: string
          maxLength: 3
          description: ISO 4217 currency code.
          example: "LKR"
        role:
          allOf:
            - $ref: '#/components/schemas/UserRoleEnum'
          description: This account's role in the company.
          example: "cashier"
        isOwner:
          type: boolean
          description: Whether this account is the owner.
          example: false
        createdAt:
          type: string
          format: date-time
          description: Company creation timestamp.
          example: "2025-06-01T10:00:00.000Z"
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: When the setup wizard was completed.
          example: "2025-06-01T10:30:00.000Z"
        subscription:
          allOf:
            - $ref: '#/components/schemas/CompanySubscriptionSummary'
          description: Subscription summary. Null if unavailable.
        usage:
          allOf:
            - $ref: '#/components/schemas/CompanyUsageSummary'
          description: Storage summary. Null if unavailable.
        limits:
          $ref: '#/components/schemas/CompanyLimits'
      required:
        - id
        - name
        - slug
        - businessType
        - status
        - email
        - currency
        - role
        - isOwner
        - createdAt
        - limits
    
    CreateCompanyRequest:
      type: object
      description: >
        Request body for POST /api/account/companies.
      properties:
        name:
          type: string
          maxLength: 255
          description: Company display name.
          example: "Sunrise Retail"
        slug:
          type: string
          minLength: 3
          maxLength: 25
          description: >
            Unique business code. Lowercase letters, numbers, and hyphens only. Cannot start or end with a hyphen. Cannot be a reserved word.
          example: "sunrise-retail"
        businessType:
          type: string
          enum: [retail, restaurant, supermarket, auto_service, dealership]
          description: Business type.
          example: "retail"
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
          description: Company email.
          example: null
        phone:
          type: string
          maxLength: 50
          nullable: true
          description: Company phone number.
          example: null
        address:
          type: string
          maxLength: 500
          nullable: true
          description: Company address.
          example: null
        country:
          type: string
          minLength: 2
          maxLength: 10
          description: ISO 3166-1 alpha-2 country code.
          example: "LK"
        dateFormat:
          type: string
          minLength: 1
          maxLength: 50
          description: Preferred date format.
          example: "DD/MM/YYYY"
        timeFormat:
          type: string
          minLength: 1
          maxLength: 50
          description: Preferred time format.
          example: "12h"
        tierId:
          type: string
          format: uuid
          nullable: true
          description: Required for additional companies (Flow B).
          example: "d4e5f6a7-b8c9-0123-def0-345678901234"
        billingCycle:
          type: string
          enum: [monthly, yearly]
          nullable: true
          description: Billing cycle for Flow B. Defaults to monthly.
          example: "monthly"
        aiEnabled:
          type: boolean
          nullable: true
          description: Enable AI features for this company.
          example: false
      required:
        - name
        - slug
        - businessType
        - country
        - dateFormat
        - timeFormat
    
    CreateCompanyResponse:
      type: object
      description: >
        Returned when the first company is created immediately (Flow A).
        `isPending` is always false.
        `creditApplied` is null if no subscription credit was available.
      properties:
        id:
          type: string
          format: uuid
          description: Tenant ID.
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        slug:
          type: string
          description: Business code (subdomain).
          example: "sunrise-retail"
        name:
          type: string
          description: Company name.
          example: "Sunrise Retail"
        isPending:
          type: boolean
          description: Always false for Flow A.
          example: false
        creditApplied:
          type: object
          nullable: true
          description: Subscription credit applied to this company if any. Null for free-forever first companies.
          properties:
            type:
              type: string
              enum: [trial, paid]
              description: Credit type.
              example: "trial"
            remainingDays:
              type: integer
              description: Days of subscription applied from credit.
              example: 23
          required:
            - type
            - remainingDays
      required:
        - id
        - slug
        - name
        - isPending
    
    CreateCompanyPendingResponse:
      type: object
      description: >
        Returned when an additional company is created and payment is required (Flow B). 
        `isPending` is always true. 
        The client should redirect to the payment flow.
      properties:
        id:
          type: string
          format: uuid
          description: Pending company ID.
          example: "c3d4e5f6-a7b8-9012-cdef-234567890123"
        slug:
          type: string
          description: Reserved business code.
          example: "new-branch"
        isPending:
          type: boolean
          description: Always true for Flow B.
          example: true
      required:
        - id
        - slug
        - isPending
    
    DeleteCompanyRequest:
      type: object
      description: >
        Request body for DELETE /api/account/companies.
        Password confirmation is required to prevent accidental deletion.
      properties:
        tenantId:
          type: string
          format: uuid
          description: ID of the company to delete.
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        password:
          type: string
          format: password
          description: >
            Account owner's current password. Verified via bcrypt before deletion proceeds.
          example: "MySecurePassword123"
      required:
        - tenantId
        - password
    
    AdminUserItem:
      type: object
      description: >
        A single admin user entry returned.
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier.
          example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
        fullName:
          type: string
          maxLength: 255
          description: User's full name.
          example: "John Doe"
        email:
          type: string
          format: email
          maxLength: 255
          description: User's email address.
          example: "john@sunrise.lk"
        role:
          allOf:
            - $ref: '#/components/schemas/UserRoleEnum'
          description: User's role in the company.
          example: "cashier"
        isActive:
          type: boolean
          description: Whether the user account is active.
          example: "true"
        createdAt:
          type: string
          format: date-time
          description: User creation timestamp.
          example: "2025-06-01T10:00:00.000Z"
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Last login timestamp.
          example: null
      required:
        - id
        - fullName
        - email
        - role
        - isActive
        - createdAt
    
    CreateAdminUserRequest:
      type: object
      description: >
        Request body for /api/account/companies/{id}/admins.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          description: User's full name.
          example: "John Doe"
        email:
          type: string
          format: email
          description: >
            User's email address. Automatically lowercased and trimmed.
          example: "john@sunrise.lk"
        password:
          type: string
          format: password
          minLength: 8
          description: >
            User's password. Minimum 8 characters.
          example: "SecurePass123"
        role:
          type: string
          enum: [owner, manager, cashier, technician]
          description: >
            User's role in this company. Defaults to `manager` if not provided.
            Note: only 4 roles are available via this endpoint.
          example: "manager"
      required:
        - fullName
        - email
        - password
        - role
    
    CreateAdminUserResponse:
      type: object
      description: >
        Returned on successful admin user creation.
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier.
          example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
        fullName:
          type: string
          description: User's full name.
          example: "John Doe"
        email:
          type: string
          format: email
          description: User's email address.
          example: "john@sunrise.lk"
        role:
          type: string
          description: User's role in this company.
          example: "manager"
        createdAt:
          type: string
          format: date-time
          description: User creation timestamp.
          example: "2026-03-28T10:00:00.000Z"
      required:
        - id
        - fullName
        - email
        - role
        - createdAt
    
    UpdateAdminUserRequest:
      type: object
      description: >
        Request body for PUT /api/account/companies/{id}/admins/{userId}.
        All fields are optional — send only the fields you want to change.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            User's full name. Whitespace trimmed server-side.
          example: "John Doe"
        role:
          type: string
          enum: [owner, manager, cashier, technician]
          description: >
            User's role in this company.
