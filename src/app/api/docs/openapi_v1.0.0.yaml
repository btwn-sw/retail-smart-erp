openapi: 3.0.0

info:
  version: 1.0.0
  title: Retail Smart ERP API
  description: OpenAPI specification for the Retail Smart ERP backend API. (placeholder_description)

servers:
  - url: https://api.example.com
    description: Production Server (placeholder)

tags:
  - name: Authentication
    description: Authentication and session-related endpoints.
  
security:
  - cookieAuth: []
  - accountCookieAuth: []

paths:
  # ---- /auth ----
  /auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate current session
      description: >
        Checks whether the caller's current session is still valid by running real-time database checks - not just reading the session cookie.

        This endpoint is intended to be called **periodically in the background** by the client to detect server-side acess changes (e.g., user deactivation, company suspension, or session expiry due to inactivity).
      operationId: validateSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: >
            Session is valid. All database checks passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. The `reason` field explains why.
            Possible reasons:
              - No session cookie present
              - Business not found or inactive
              - Access revoked (user deactivated or removed)
              - Session expired due to inactivity (no activity for 3+ hours)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No active session
                  value:
                    valid: false
                busienssInactive:
                  summary: Company suspended or deleted
                  value:
                    valid: false
                    reason: "Business not found or inactive"
                accessRevoked:
                  summary: User deactivated or removed
                  value:
                    valid: false
                    reason: "Access revoked"
                inactivityExpired:
                  summary: Inactive for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: >
            Unexpected server error during validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Validation error"

  /auth/heartbeat:
    post:
      tags:
        - Authentication
      summary: Send session heartbeat
      description: >
        Called periodically by the client while the user is actively using the application. This endpoint serves two purposes:
        
        1. **Validates** that the session has not expired due to inactivity (applies the same 3-hour rule as `GET /auth/validate`).

        2. **Refreshes** the user's `lastActiveAt` timestamp in the database, keeping the sesion alive for another 3 hours.

        3. **Important:** If the sesison has already been inactive for more than 3 hours at the time of the call, the timestamp is **not** updated and the session **cannot** be revived. The user must log in again.

        > **Note:** No request body is required. The server reads identity from the session cookie.

        > **Note:** Platform account users (no `tenantId`) bypass all database checks and always receive `valid: true`.

      operationId: sendHeartbeat
      security:
        - cookieAuth: []
      requestBody:
        required: false
        description: >
          No request body required.
      responses:
        '200':
          description: >
            Session is valid and `lastActiveAt` has been refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. Possible reasons:
              - No active session cookie
              - User record not found in the database
              - Session expired due to inactivity (no activity for 3+ hours)
            
            When `valid: false` is returned, the client should redirect the user to the login page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No active session
                  value:
                    valid: false
                userNotFound:
                  summary: User record not found
                  value:
                    valid: false
                inactivityExpired:
                  summary: Inactive for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Heartbeat error"

  /auth/ws-token:
    get:
      tags:
        - Authentication
      summary: Get WebSocket authentication token
      description: >
        Generates a short-lived JWT token (expires in 1hour) for authenticating WebSocket connections. The caller must already have an active session (either tenant or account). No request body or query parameters are required - the server reads the session from the caller's cookies.

        The token payload varies by session type:
          - **Tenant mode** (company user): includes `id`, `name`, `tenantId`, `tenantSlug`, `role`, `mode: "tenant"`
          - **Account mode** (platform user): includes `id`, `accountId`, `name`, `mode: "account"`
      operationId: getWsToken
      security:
        - cookieAuth: []
      responses:
        '200':
          description: JWT Token successfully generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTokenResponse'
        '401':
          description: >
            No active session found. The user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: >
            Server Error - either the server secret is not configured, or an unexpected internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSecret:
                  summary: Server misconfiguration
                  value:
                    error: "Server configuration error"
                unexpectedError:
                  summary: Unexpected internal error
                  value:
                    error: "Failed to generate token"

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset email
      description: >
        Sends a password reset email to the provided address if a matching platform account exists. This endpoint applies to **platform account users only** - not to tenant (company) staff users.
      operationId: ForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: >
            Always returned, regardless of whether the email exists or the reset email was sent. This behvior is intentional to prevent email enumeration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: >
                  If an account exists with that email, we've sent password reset instructions.
        '422':
          description: >
            Request body failed validation. The email field is missing or not a valid email format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid email address"

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset account password using reset token
      description: >
        Completes the password reset flow initiated by `POST /auth/forgot-password`. Accepts the JWT from the reset email and a new password, verifies all conditions, then updates the password in the database.

        **This endpoint applies to platform account users only** (not tenant staff users).
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: >
            Password successfully reset. All active sessions have been revoked. The user may now sign in with the new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: >
                  Password has been reset succesuully.
                  You can now sign in with your new password.
        '400':
          description: >
            The reset token is invalid, expired, or the account could not be verified. Possible error messages:
              - `"Invalid or expried reset link. Please request a new one." - JWT failed verification
              - `"Invalid reset link. Please request a new one."` - wrong tokien purpose or email mismatch
              - `"ACcount not found. Please request a new reset link."` - account no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredToken:
                  summary: Token expired or signaure invalid
                  value:
                    error: "Invalid or expired reset link. Please request a new one."
                invalidToken:
                  summary: Wrong purpose or email mismatch
                  value:
                    error: "Invalid reset link. Please request a new one."
                accountNotFound:
                  summary: Account no longer exists
                  value:
                    error: "Account not found. Please reqeust a new reset link."
        '429':
          description: >
            Too many reset attempts from this IP address. This limit is database-persisted and survives server restarts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many attempts. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to reset password. Please try again."

  /auth/staff-forgot-password:
    post:
      tags:
        - Authentication
      summary: Request staff password reset email
      description: >
        Sends a password reset email to a **tenant staff user** if a matching active account is found within the specified company.
        This is the staff counterpart to `POST /auth/forgot-password`, which handles platform account owners.
      operationId: StaffForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffForgotPasswordRequest'
      responses:
        '200':
          description: >
            Always returned regardless of whether the company or staff user exists, the rate limit was hit, or an error occurred. This behavior is intentional to prevent emial enumeration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: true
                message: >
                  If a staff account exists with that email, we've sent password reset instructions.
        '422':
          description: >
            Request body failed validation. `email` or `tenantSlug` is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/staff-reset-password:
    post:
      tags:
        - Authentication
      summary: Reset staff password using reset token
      description: >
        Completes the staff password reset flow initiated by `POST /auth/staff-forgot-password`. Accepts the JWT from the staff reset email and a new password, verifies all conditions within the tenant's isolated database context, then updates the password.
      operationId: staffResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffResetPasswordRequest'
      responses:
        '200':
          description: >
            Password successfully reset. Sessions are revoked if the user has a linked platform account (`accountId`). The user may now sign in with the new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: true
                message: >
                  Password has been reset successfully. You can now sign in with your new password.
        '400':
          description: >
            The reset token is invalid, expired, or the user could not be verified. Possible error messages:
              - `"Invalid or expired reset link. Please request a new one."` - JWT failed verification (expired or tampered)
              - `"Invalid reset link. Please request a new one."` - wrong token purpose, missing fields, or email mismatch
              - `"User not found. Please request a new reset link."` - user no longer exists or has been deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredToken:
                  summary: Token expired or signature invalid
                  value:
                    error: "Invalid or expired reset link. Please request a new one."
                invalidToken:
                  summary: Wrong purpose, missing fields, or email mismatch
                  value:
                    error: "Invalid reset link. Please request a new one."
                userNotFound:
                  summary: User deactivated or removed
                  value:
                    error: "User not found. Please request a enw reset link."
        '422':
          description: >
            Request body failed validation. `token` or `newPassword` is missing or does not meet requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Too many reset attempts from this IP address. Uses the same database-persisted rate limit config as `POST /auth/reset-password`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many attempts. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to reset password. Please try again."

  # ---- /account-auth ----
  /account-auth/heartheat:
    post:
      tags:
        - Authentication
      summary: Account session keep-alive
      description: >
        Keep-alive signla for **platform account users**. Validates the account session and updates `lastActiveAt` on the account record.
      operationId: accountHeartbeat
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: >
            Session is valid and active. `lastActiveAt` has been updated and the session expiry has been exteneded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid or has expired. The `valid` field is always `false`. The `reason` field is present only when the session expired due to inactivity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                noSession:
                  summary: No valid session cookie
                  value:
                    valid: false
                inactivity:
                  summary: Session expired due to inactivity
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Heartbeat error"

  /account-auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate account session
      description: >
        Validates the current platform account session against the database. This is the account-level counterpart to `GET /auth/validate`, which serves tenant staff users.

        Read-only - does **not** write `lastActiveAt`.
      operationId: validateAccountSession
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: >
            Session is valid. The account exists and has been active within the last 3 hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: true
        '401':
          description: >
            Session is invalid. The `valid` field is always `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                revoked:
                  summary: Session explicitly revoked
                  value:
                    valid: false
                    reason: "Session revoked"
                notFound:
                  summary: Account no longer eixsts
                  value:
                    valid: false
                    reason: "Account not found"
                inactivity:
                  summary: Inactive for more than 3 hours
                  value:
                    valid: false
                    reason: "Session expired due to inactivity"
        '500':
          description: >
            Unexpected server error. Errors are logged via `logError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              example:
                valid: false
                reason: "Validation error"

  /account-auth/transfer:
    post:
      tags:
        - Authentication
      summary: Generate company transfer token
      description: >
        Generates a short-lived transfer token that allows a platform account owner to enter a company (tenant) staff session **without re-entering credentials**. 

        > **Auth required.** Must be called with a valid platform account session.
      operationId: generateTransferToken
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferAuthRequest'
            examples:
              byTenantId:
                summary: Transfer using company UUID
                value:
                  tenantId: "b3d2e1f0-1234-5678-abcd-ef0123456789"
              byTenantSlug:
                summary: Transfer using company slug
                value:
                  tenantSlug: "city-mart"
      responses:
        '200':
          description: >
            Transfer token successfully generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferAuthResponse'
              example:
                transferToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…"
                slug: "city-mart"
        '401':
          description: >
            No valid account session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: >
            The account does not have an active membership in the requested company.The company exists but the account is not a member, or the membership has been revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "No access to this company"
        '404':
          description: >
            Company not found or not active. The `tenantId` or `tenantSlug` does not match any existing company, or the company has been suspended (`status` is not `"active"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Company not found or inactive"
        '422':
          description: >
            Request body validation failed. Neither `tenantId` nor `tenantSlug` was provided, or the provided values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >
            Server configuration error (missing `NEXTAUTH_SECRET` or unexpected error during token generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                configError:
                  summary: Missing server configuration
                  value:
                    error: "Server configuration error"
                serverError:
                  summary: Unexpected error
                  value:
                    error: "Failed to generate transfer token"

  # ---- /register ----
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new platform account
      description: >
        Creats a new platform account for an owner or manager. **This endpoint is for platform account owners only.**
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: >
            Account created successfully. The user must sign in separately — registration does not create a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: >
            Validation error or duplicate account detected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCountry:
                  summary: Unrecognized country code
                  value:
                    error: "Invalid country selected"
                duplicateEmail:
                  summary: Email already registered
                  value:
                    error: "This email is already registered"
                duplicatePhone:
                  summary: Phone already registered
                  value:
                    error: "This mobile number is already registered"
        '422':
          description: >
            Request body failed schema validation. Required fields missing or incorrectly formatted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Too many registration attempts from this IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many registration attempts. Please try again later."
        '500':
          description: >
            Unexpected server error during registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Registration failed. Please try again."
  
  /register/check-email:
    post:
      tags:
        - Authentication
      summary: Check email availability for registration
      description: >
        Checks whether an email address is available for a new platform account registration.
      operationId: checkEmailAvailability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEmailRequest'
      responses:
        '200':
          description: >
            Email availability check completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckEmailResponse'
              examples:
                available:
                  summary: Email is free to use
                  value:
                    available: true
                taken:
                  summary: Email already registered
                  value:
                    available: false
        '422':
          description: >
            Request body validation failed. `email` is missing or not a valid email format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Too many requests from this IP address within the last minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many requests. Please try again later."
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to check email"

  /register/send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP verification code to email
      description: >
        Generates a 5-digit OTP and sends it to the specified email address. 
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: >
            OTP successfully generated and sent to the email address. The code expires in 10 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              example:
                success: true
                message: "Verification code sent"
        '422':
          description: >
            Request body validation failed. `email` or `type` is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description:
            Too many OTP requests for this email and type within the last hour. Maximum 5 allowed per email per `type` per hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Too many verification attempts. Please try again later."
        '500':
          description:
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to send verification code. Please try again."
  
  /register/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP code and receive verification token
      description: >
        Verifies the 5-digit OTP submitted by the user against the hashed OTP stored in the database. On success, issues a short-lived `verificationToken` JWT that proves email ownership.
      operationId: VerifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: >
            OTP verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: >
            OTP verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: No unverified OTP exists
                  value:
                    error: "No verification code found. Please request a new one."
                expired:
                  summary: OTP has expired
                  value:
                    error: "Verification code has expired. Please request a new one."
                locked:
                  summary: Too many incorrect attempts
                  value:
                    error: "Too many incorrect atttempts. Please request a new code."
                incorrect:
                  summary: Wrong code — attempts remaining
                  value:
                    error: "Incorrect code. 3 attempts remaining."
        '422':
          description: >
            Request body validation failed. `email`, `otp`, or `type` is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >
            Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: "Verification failed. Please try again."

  # ---- /lookup-tenant ----
  /lookup-tenant:
    post:
      tags:
        - Authentication
      summary: Look up companies associated with an email address
      description: >
        Returns a list of active companies (tenants) that the given email address is associated with.
      operationId: lookupTenantByEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTenantRequest'
      responses:
        '200':
          description: >
            Lookup completed. Returns a list of companies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTenantResponse'
              examples:
                found:
                  summary: Email associated with one or more companies
                  value:
                    tenants:
                      - slug: "city-mart"
                        name: "City Mart"
                      - slug: "downtown-cafe"
                        name: "Downtown Cafe"
                notFound:
                  summary: Email not registered or no active memberships
                  value:
                    tenants: []
        '422':
          description: >
            Request body validation failed. `email` is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Too many requests for this email within the last minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
