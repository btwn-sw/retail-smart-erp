          type: string
          format: uuid
          description: Account that submitted this deposit.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        subscriptionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Linked subscription ID. Null for wallet deposits.
          example: null
        amount:
          type: string
          description: >
            Deposit amount as a decimal string (DB decimal type).
          example: "2900.00"
        currency:
          type: string
          maxLength: 3
          description: ISO 4217 3-letter currency code. Defaults to account currency.
          example: "LKR"
        bankReference:
          type: string
          maxLength: 100
          nullable: true
          description: Bank transaction reference number.
          example: "BNK-2026-001234"
        depositDate:
          type: string
          description: >
            Date the deposit was made, in YYYY-MM-DD format (DB date type — not a timestamp).
          example: "2026-03-29"
        receiptUrl:
          type: string
          nullable: true
          description: URL of the uploaded receipt image.
          example: null
        notes:
          type: string
          nullable: true
          description: User-provided notes.
          example: "March subscription payment"
        status:
          type: string
          enum: [pending, approved, rejected]
          description: Deposit review status. Always `pending` on creation.
          example: "pending"
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          description: Admin who reviewed this deposit.
          example: null
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when reviewed.
          example: null
        reviewNotes:
          type: string
          nullable: true
          description: Admin review notes.
          example: null
        periodMonths:
          type: integer
          description: >
            Number of months this payment covers.
          example: 1
        isWalletDeposit:
          type: boolean
          description: Whether this is a wallet credit deposit.
          example: false
        pendingCompanyId:
          type: string
          format: uuid
          nullable: true
          description: Linked pending company ID, if applicable.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: "2026-03-29T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
          example: "2026-03-29T10:00:00.000Z"
        subscription:
          allOf:
            - $ref: '#/components/schemas/SubscriptionRecord'
          description: >
            Nested subscription with tenant and tier. Null if not linked.
      required:
        [id, accountId, amount, currency, depositDate, status, periodMonths, isWalletDeposit, createdAt, updatedAt, subscription]
    
    CreatePaymentDepositRequest:
      type: object
      description: >
        Request body for POST /api/account/payments.
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: Subscription to pay for.
          example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
        pendingCompanyId:
          type: string
          format: uuid
          description: Pending company to pay for.
          example: "c3d4e5f6-a7b8-9012-cdef-234567890123"
        amount:
          type: number
          description: >
            Deposit amount. Must be greater than zero.
          example: 2900
        bankReference:
          type: string
          maxLength: 255
          description: Bank transaction reference number.
          example: "BNK-2026-001234"
        depositDate:
          type: string
          minLength: 1
          description: >
            Date the deposit was made in YYYY-MM-DD format.
          example: "2026-03-29"
        notes:
          type: string
          maxLength: 100
          description: Optional notes about the deposit.
          example: "March subscription payment"
        periodMonths:
          type: integer
          description: >
            Number of months this payment covers.
          example: 1
        isWalletDeposit:
          type: boolean
          description: >
            If true, this is a wallet credit deposit.
            Defaults to false.
          example: false
      required:
        - amount
        - depositDate
        - periodMonths
        - isWalletDeposit
    
    CreatePaymentDeposit:
      type: object
      description: >
        Full payment deposit row returned on successful POST.
      properties:
        id:
          type: string
          format: uuid
          example: "g8h9i0j1-k2l3-4567-m890-123456789012"
        accountId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        subscriptionId:
          type: string
          format: uuid
          nullable: true
          example: null
        amount:
          type: string
          description: Decimal stored as string.
          example: "2900.00"
        currency:
          type: string
          example: "LKR"
        bankReference:
          type: string
          nullable: true
          example: "BNK-2026-001234"
        depositDate:
          type: string
          description: YYYY-MM-DD format.
          example: "2026-03-29"
        receiptUrl:
          type: string
          nullable: true
          example: null
        notes:
          type: string
          nullable: true
          example: "March subscription payment"
        status:
          type: string
          enum: [pending]
          description: Always `pending` on creation.
          example: "pending"
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          example: null
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        reviewNotes:
          type: string
          nullable: true
          example: null
        periodMonths:
          type: integer
          example: 1
        isWalletDeposit:
          type: boolean
          example: false
        pendingCompanyId:
          type: string
          format: uuid
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-03-29T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-29T10:00:00.000Z"
      required:
        [id, accountId, amount, currency, depositDate, status, periodMonths, isWalletDeposit, createdAt, updatedAt]

    InviteTenantAssignmentDetail:
      type: object
      description: >
        A single tenant assignment in an invite response, enriched with tenant name.
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant unique identifier.
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        tenantName:
          type: string
          description: >
            Tenant display name. Returns 'Unknown' if tenant has been deleted.
          example: "Sunrise Retail"
        role:
          type: string
          description: Assigned role in this tenant.
          example: "manager"
      required:
        - tenantId
        - tenantName
        - role
    
    InviteListItem:
      type: object
      description: >
        A single invite entry returned by GET /api/account/invites.
      properties:
        id: 
          type: string
          format: uuid
          description: Invite unique identifier.
          example: "h9i0j1k2-l3m4-5678-n901-234567890123"
        email:
          type: string
          format: email
          description: Invited email address.
          example: "staff@example.com"
        tenantAssignments:
          type: array
          description: Tenant assignments with enriched tenant names.
          items:
            $ref: '#/components/schemas/InviteTenantAssignmentDetail'
        expiresAt:
          type: string
          format: date-time
          description: Invite expiry timestamp  7 days after creation.
          example: "2026-04-05T10:00:00.000Z"
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When the invite was accepted. Null if not yet accepted.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: "2026-03-29T10:00:00.000Z"
        status:
          type: string
          enum: [pending, accepted, expired]
          description: >
            Computed invite status — not stored in DB.
          example: "pending"
      required:
        [id, email, tenantAssignments, expiresAt, createdAt, status]
    
    CreateInviteRequest:
      type: object
      description: >
        Request body for POST /api/account/invites.
      properties:
        email:
          type: string
          format: email
          description: >
            Email address to invite. Automatically lowercased and trimmed. Must not have an existing active invite.
          example: "staff@example.com"
        tenantAssignments:
          type: array
          minItems: 1
          maxItems: 20
          description: >
            Tenant assignments for this invite. Min 1, max 20.
          items:
            type: object
            properties:
              tenantId:
                type: string
                format: uuid
                description: Tenant to assign the invite to.
                example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
              role:
                type: string
                enum: [owner, manager, cashier, technician]
                description: >
                  Role to assign. Only 4 roles are available via this endpoint — not the full platform role set.
                example: "manager"
            required:
              [tenantId, role]
      required:
        - email
        - tenantAssignments
    
    CreateInvite:
      type: object
      description: >
        Returned on successful invite creation.
      properties:
        id:
          type: string
          format: uuid
          description: Invite unique identifier.
          example: "h9i0j1k2-l3m4-5678-n901-234567890123"
        email:
          type: string
          format: email
          description: Invited email address.
          example: "staff@example.com"
        token:
          type: string
          description: >
            64-character hex invite token (32 random bytes).
        tenantAssignments:
          type: array
          description: Tenant assignments with enriched tenant names.
          items:
            $ref: '#/components/schemas/InviteTenantAssignmentDetail'
        expiresAt:
          type: string
          format: date-time
          description: Invite expiry timestamp — 7 days after creation.
          example: "2026-04-05T10:00:00.000Z"
        inviteUrl:
          type: string
          description: >
            Full invite URL to send to the invitee.
          example: "https://app.retailsmarterp.com/invite/a1b2c3d4e5f6..."
      required:
        [id, email, token, tenantAssignments, expiresAt, inviteUrl]

    ResendInviteResponse:
      type: object
      description: >
        Returned on successful invite resend.
        The invite expiry is extended to 7 days from the time of this request.
      properties:
        success:
          type: boolean
          description: Always true on 200 response.
          example: true
        expiresAt:
          type: string
          format: date-time
          description: New expiry timestamp — 7 days from the time of this request.
          example: "2026-04-09T10:00:00.000Z"
      required:
        - success
        - expiresAt
    
    AccountSessionItem:
      type: object
      description: >
        A single active session entry. `sessionToken` is never included — use `isCurrent` to identify the caller's session.
        Session lifetime is 24 hours, extended on each heartbeat.
      properties:
        id:
          type: string
          format: uuid
          description: Session unique identifier.
          example: "i0j1k2l3-m4n5-6789-o012-345678901234"
        scope:
          type: string
          enum: [account, company]
          maxLength: 20
          description: >
            Session scope. `account` for account-level sessions, `company` for tenant-scoped sessions.
          example: "company"
        tenantSlug:
          type: string
          nullable: true
          maxLength: 100
          description: >
            Tenant slug for company-scoped sessions. Null for account-scoped sessions.
          example: null
        ipAddress:
          type: string
          maxLength: 45
          nullable: true
          description: >
            IP address at the time of login.
          example: "203.0.113.1"
        deviceName:
          type: string
          maxLength: 255
          nullable: true
          description: Human-readable device name parsed from user agent.
          example: "Chrome on Windows"
        lastActivityAt:
          type: string
          format: date-time
          description: Last activity timestamp.
          example: "2026-03-29T09:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          description: Session creation timestamp.
          example: "2026-03-29T08:00:00.000Z"
        expiresAt:
          type: string
          format: date-time
          description: Session expiry timestamp.
          example: "2026-03-30T08:00:00.000Z"
        isCurrent:
          type: boolean
          description: >
            Whether this is the session making the current request.
          example: true
      required:
        [id, scope, lastActivityAt, createdAt, expiresAt, isCurrent]
    
    SessionsListResponse:
      type: object
      description: >
        Response wrapper for GET /api/account/sessions.
      properties:
        sessions:
          type: array
          description: >
            List of active sessions ordered by last activity descending.
          items:
            $ref: '#/components/schemas/AccountSessionItem'
      required:
        - sessions
    
    RevokeSessionsRequest:
      type: object
      description: >
        Request body for DELETE /api/account/sessions.
      properties:
        exceptCurrent:
          type: boolean
          description: >
            If true, keeps the current session alive and revokes all others ("sign out other devices").
            If false or omitted, all sessions are revoked including the current one.
          example: true
    
    SubscriptionTierDetail:
      type: object
      description: >
        Pricing tier summary used in GET /api/account/subscriptions/{tenantId}.
      properties:
        id:
          type: string
          format: uuid
          example: "d4e5f6a7-b8c9-0123-def0-345678901234"
        name:
          type: string
          maxLength: 50
          example: "professional"
        displayName:
          type: string
          maxLength: 100
          example: "professional"
        priceMonthly:
          type: string
          nullable: true
          description: Monthly price.
          example: null
        priceYearly:
          type: string
          nullable: true
          description: Yearly price.
          example: null
        maxUsers:
          type: integer
          nullable: true
          description: Maximum number of users allowed.
          example: null
        maxSalesMonthly:
          type: integer
          nullable: true
          description: Maximum monthly sales transactions.
          example: null
        maxDatabaseBytes:
          type: integer
          nullable: true
          description: Maximum database storage in bytes.
          example: null
        maxFileStorageBytes:
          type: integer
          nullable: true
          description: Maximum file storage in bytes.
          example: null
        features:
          type: object
          nullable: true
          description: Feature flags for this tier.
          additionalProperties: true
          example: {}
      required:
        - id
        - name
        - displayName

    SubscriptionDetailResponse:
      type: object
      description: >
        Response from GET /api/account/subscriptions/{tenantId}.
      properties:
        subscription:
          type: object
          description: Subscription summary.
          properties:
            id:
              type: string
              format: uuid
              example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
            status:
              type: string
              enum: [trial, active, past_due, cancelled, locked]
              example: "trial"
            currentPeriodStart:
              type: string
              format: date-time
              nullable: true
              example: "2026-03-01T00:00:00.000Z"
            currentPeriodEnd:
              type: string
              format: date-time
              nullable: true
              example: "2026-04-01T00:00:00.000Z"
            trialEndsAt:
              type: string
              format: date-time
              nullable: true
              example: null
            cancelAtPeriodEnd:
              type: boolean
              description: >
                Whether the subscription will cancel at the end of the current period.
              example: false
          required: [id, status, cancelAtPeriodEnd]
        currentTier:
          allOf:
            - $ref: '#/components/schemas/SubscriptionTierDetail'
          nullable: true
          description: >
            Current pricing tier details. Null if tier record no longer exists.
        availableTiers:
          type: array
          description: >
            All active pricing tiers ordered by sortOrder ascending.
          items:
            $ref: '#/components/schemas/SubscriptionTierDetail'
        usage:
          type: object
          nullable: true
          description: >
            Current storage usage for this tenant.
          properties:
            databaseBytes:
              type: integer
              description: Database storage used in bytes.
              example: 0
            fileStorageBytes:
              type: integer
              description: File storage used in bytes.
              example: 0
          required: [databaseBytes, fileStorageBytes]
        canManage:
          type: boolean
          description: >
            Whether the authenticated account can modify this subscription.
          example: true
      required:
        - subscription
        - currentTier
        - availableTiers
        - usage
        - canManage
    
    UpdateSubscriptionRequest:
      type: object
      description: >
        Request body for PUT api/account/subscriptions/{tenantId}.
      required:
        - cancelAtPeriodEnd
      properties:
        cancelAtPeriodEnd:
          type: boolean
          description: >
            Whether to cancel the subscription at the end of the current period.
            Set to `true` to schedule cancellation: `false` to resume.
          example: false
        tierId:
          type: string
          format: uuid
          description: >
            Not accepted by this endpoint. Providing this field returns 400. Use POST /upgrade for tier changes.

    UpdateSubscriptionResponse:
      type: object
      description: >
        Response from PUT /api/account/subscriptions/{tenantId}.
      properties:
        id:
          type: string
          format: uuid
          example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
        status:
          type: string
          enum: [trial, active, past_due, cancelled, locked]
          example: "active"
        tierId:
          type: string
          format: uuid
          description: Current tier Id. Unchanged by this endpoint.
          example: "d4e5f6a7-b8c9-0123-def0-345678901234"
        cancelAtPeriodEnd:
          type: boolean
          description: Updated cancellation flag.
          example: false
      required:
        - id
        - status
        - tierId
        - cancelAtPeriodEnd
    
    UpgradeTierSummary:
      type: object
      description: >
        Tier summary returned in upgrade preview responses.
        `price` is a number computed server-side from priceMonthly/priceYearly.
      properties:
        id:
          type: string
          format: uuid
          example: "d4e5f6a7-b8c9-0123-def0-345678901234"
        name:
          type: string
          description: Tier displayName.
          example: "Professional"
        price:
          type: number
          description: Price for the selected billing cycle.
          example: 2900
      required:
        - id
        - name
        - price
    
    ProrationDetail:
      type: object
      description: >
        Proration calculation detail returned in preview for paid subscription changes.
      properties:
        daysRemaining:
          type: integer
          description: Days remaining in the current billing period.
          example: 15
        totalDaysInPeriod:
          type: integer
          description: Total days in the current billing period.
          example: 31
        creditAmount:
          type: number
          description: Unused credit from current plan.
          example: 1403.23
        newPlanCost:
          type: number
          description: Prorated cost for the new plan for remaining days.
          example: 1403.23
      required:
        - daysRemaining
        - totalDaysInPeriod
        - creditAmount
        - newPlanCost
    
    UpgradeSubscriptionRequest:
      type: object
      description: >
        Request body for POST /api/account/subscriptions/{tenantId}/upgrade.
      properties:
        newTierId:
          type: string
          format: uuid
          description: Target pricing tier ID. Must be active.
          example: "d4e5f6a7-b8c9-0123-def0-345678901234"
        billingCycle:
          type: string
          enum: [monthly, yearly]
          description: Desired billing cycle. Defaults to `monthly`.
          example: "monthly"
        action:
          type: string
          enum: [preview, execute]
          description: >
            `preview` returns cost preview without changes.
            `execute` performs the actual change.
          example: "preview"
      required:
        - newTierId
        - billingCycle
        - action
    
    TrialUpgradePreviewResponse:
      type: object
      description: >
        Preview response when the subscription is in trial status.
        No proration applies — full price for the new plan.
      properties:
        currentTier:
          $ref: '#/components/schemas/UpgradeTierSummary'
        newTier:
          $ref: '#/components/schemas/UpgradeTierSummary'
        amountDue:
          type: number
          description: Full price for the new plan (no proration).
          example: 2900
        isUpgrade:
          type: boolean
          description: Always true for trial → paid transitions.
          example: true
        billingCycle:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        noProration:
          type: boolean
          description: Always true — no proration for trial subscription.
          example: true
        walletBalance:
          type: number
          description: Current wallet balance.
          example: 5000
      required:
        [currentTier, newTier, amountDue, isUpgrade, billingCycle, noProration, walletBalance]
    
    PaidUpgradePreviewResponse:
      type: object
      description: >
        Preview response for paid subscription tier changes.
        Includes proration details.
      properties:
        currentTier:
          $ref: '#/components/schemas/UpgradeTierSummary'
        newTier:
          $ref: '#/components/schemas/UpgradeTierSummary'
        proration:
          $ref: '#/components/schemas/ProrationDetail'
        amountDue:
          type: number
          description: >
            New amount due. Positive = upgrade (extra charge), 0 = same cost, negative = downgrade (credit).
          example: 0
        isUpgrade:
          type: boolean
          description: Whether this is an upgrade (amountDue > 0).
          example: true
        billingCycle:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        currentBillingCycle:
          type: string
          enum: [monthly, yearly]
          description: Current billing cycle before this change.
          example: "monthly"
        cycleChanging:
          type: boolean
          description: Whether the billing cycle is also changing.
          example: false
        walletBalance:
          type: number
          description: Current wallet balance.
          example: 5000
      required:
        [currentTier, newTier, proration, amountDue, isUpgrade, billingCycle, currentBillingCycle, cycleChanging, walletBalance]
    
    RequiresPaymentResponse:
      type: object
      description: >
        Returned when payment via PayHere is required to complete the upgrade.
      properties:
        requiresPayment:
          type: boolean
          description: Always true.
          example: true
        newTierId:
          type: string
          format: uuid
          description: Target tier to apply after payment.
          example: "d4e5f6a7-b8c9-0123-def0-345678901234"
        amount:
          type: number
          description: Amount to pay via PayHere.
          example: 1500
        walletCredit:
          type: number
          description: >
            Partial wallet amount already deducted (only present in Case 2 with walletBalance > 0).
          example: 1400
        billingCycle:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        subscriptionId:
          type: string
          format: uuid
          description: Subscription ID for PayHere checkout reference.
          example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
      required:
        [requiresPayment, newTierId, amount, billingCycle, subscriptionId]
    
    UpgradeSuccessZeroAmountResponse:
      type: object
      description: >
        Returned when execute succeeds with amountDue of 0.
      properties:
        success:
          type: boolean
          example: true
        amountDue:
          type: integer
          example: 0
      required:
        - success
        - amountDue
    
    UpgradeSuccessWalletPaidResponse:
      type: object
      description: >
        Returned when an upgrade executes successfully and wallet covers the full amount.
      properties:
        success:
          type: boolean
          example: true
        paidFromWallet:
          type: boolean
          description: Always true for this response.
          example: true
        amountCharged:
          type: number
          description: Amount deducted from wallet.
          example: 1403.23
        newWalletBalance:
          type: number
          description: Wallet balance after deduction.
          example: 3596.77
      required:
        [success, paidFromWallet, amountCharged, newWalletBalance]
    
    DowngradeSuccessResponse:
      type: object
      description: >
        Returned when a downgrade executes successfully and prorated credit is applied to the wallet.
      properties:
        success:
          type: boolean
          example: true
        creditApplied:
          type: number
          description: Prorated credit amount added to wallet.
          example: 1403.23
        newWalletBalance:
          type: number
          description: Wallet balance after credit.
          example: 6403.23
      required:
        - success
        - creditApplied
        - newWalletBalance
    
    PaginationMeta:
      type: object
      description: >
        Pagination metadata returned with paginated list responses.
      properties:
        page:
          type: integer
          description: Current page number.
          example: 1
        pageSize:
          type: integer
          description: Number of items per page.
          example: 20
        total:
          type: integer
          description: Total number of matching records.
          example: 5
        totalPages:
          type: integer
          description: Total number of pages.
          example: 1
      required:
        [page, pageSize, total, totalPages]
    
    ConversationItem:
      type: object
      description: >
        A single conversation returned by GET /api/account/messages.
        Returns all columns — no column filtering applied.
      properties:
        id:
          type: string
          format: uuid
          description: Conversation unique identifier.
          example: "k2l3m4n5-o6p7-8901-q234-567890123456"
        accountId:
          type: string
          format: uuid
          description: Account that created this conversation.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        subject:
          type: string
          maxLength: 255
          description: Conversation subject.
          example: "Billing question for March"
        status:
          type: string
          enum: [open, closed, archived]
          maxLength: 20
          description: Conversation status.
          example: "open"
        priority:
          type: string
          enum: [low, normal, high, urgent]
          maxLength: 20
          description: Conversation priority.
          example: "normal"
        category:
          type: string
          maxLength: 50
          nullable: true
          description: >
            Conversation category. Known values: billing, technical, account, general.
          example: "billing"
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last message.
          example: "2026-03-29T10:00:00.000Z"
        lastMessagePreview:
          type: string
          nullable: true
          description: Preview of the last message (first 200 characters).
          example: "I have a question about my March invoice..."
        unreadByAccount:
          type: boolean
          description: Whether there are unread messages for the account user.
          example: false
        unreadByAdmin:
          type: boolean
          description: Whether there are unread messages for the admin.
          example: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: When the conversation was closed.
          example: null
        closedBy:
          type: string
          maxLength: 50
          nullable: true
          description: Who closed the conversation.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: "2026-03-29T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
          example: "2026-03-29T10:00:00.000Z"
      required:
        [id, accountId, subject, status, priority, unreadByAccount, unreadByAdmin, createdAt, updatedAT]

    MessageItem:
      type: object
      description: >
        A single message row returned in the POST response.
      required:
        [id, conversationId, senderType, content, isSystemMessage, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Message unique identifier.
          example: "l3m4n5o6-p7q8-9012-r345-678901234567"
        conversationId:
          type: string
          format: uuid
          description: Parent conversation ID.
          example: "k2l3m4n5-o6p7-8901-q234-567890123456"
        senderType:
          type: string
          enum: [account, admin]
          maxLength: 20
          description: Type of sender. Always `account` for messages created by this endpoint.
          example: "account"
        senderId:
          type: string
          format: uuid
          nullable: true
          description: Account ID of the sender.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        senderName:
          type: string
          maxLength: 255
          nullable: true
          description: Display name of the sender. Falls back to `'User'` if name is not set.
          example: "John Smith"
        content:
          type: string
          description: Message content.
          example: "I have a question about my March invoice..."
        metadata:
          type: object
          nullable: true
          description: Additional message metadata. DB default is `{}`.
          additionalProperties: true
          example: {}
        isSystemMessage:
          type: boolean
          description: Whether this is a system-generated message.
          example: false
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the message was read.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Message creation timestamp.
          example: "2026-03-29T10:00:00.000Z"
    
    ConversationListResponse:
      type: object
      description: Response from GET /api/account/messages.
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Liast of conversations ordered by lastMessageAt descending.
          items:
            $ref: '#/components/schemas/ConversationItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    
    CreateConversationRequest:
      type: object
      description: >
        Request body for POST /api/account/meesages.
        Note: the message content field is named `message` in the request body (not `content`).
      required:
        [subject, message, category, priority]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Converstaion subject.
          example: "Billing question for March"
        message:
          type: string
          minLength: 1
          maxLength: 5000
          description: >
            Initial message content. Trimmed server-side.
            First 200 characters are stored as `lastMessagePreview`.
          example: "I have a question about my March invoice..."
        category:
          type: string
          enum: [general, billing, technical, feature_request, bug_report]
          description: Conversation category.
          example: "general"
        priority:
          type: string
          enum: [low, normal, high, urgent]
          description: Conversation priority.
          example: "normal"
    
    CreateConversationResponse:
      type: object
      description: >
        Response from POST /api/account/messages.
        Contain both the created conversation and the first message, both as full rows.
      required: [conversation, message]
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationItem'
        message:
          $ref: '#/components/schemas/MessageItem'
