# ---- /module-access ----
  /module-access:
    put:
      tags:
        - Authentication
      summary: Bulk update module access configuration
      operationId: updateModuleAccess
      description: >
        Bulk-upserts module access entries. For each entry provided, updates the existing row if one eixsts for that moduleKey + role combination, or inserts a new row if not.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModuleAccessRequest'
            example:
              entries:
                - moduleKey: "workshop"
                  role: "technician"
                  isEnabled: true
                - moduleKey: "workshop"
                  role: "cashier"
                  isEanbled: false
      responses:
        '200':
          description: >
            Module access updated. Returns the full current module access list after all entires are processed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAccessRow'
              example:
                - id: "ma_01ABC123"
                  tenantId: "ten_01XYZ789"
                  moduleKey: "inventory"
                  role: "cashier"
                  isEnabled: true
                  updatedBy: "usr_01HZ4XY9"
                  updatedAt: "2026-03-17T10:00:00Z"
                - id: "ma_02DEF456"
                  tenantId: "ten_01XYZ789"
                  moduleKey: "workshop"
                  role: "technician"
                  isEnabled: true
                  updatedBy: "usr_01HZ4XY9"
                  updatedAt: "2026-03-17T10:30:00Z"
                - id: "ma_03GHI789"
