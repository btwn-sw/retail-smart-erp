                tenantId: "ten_01XYZ789"
                name: "Front Counter Staff"
                slug: "front_counter_staff"
                baseRole: "cashier"
                description: "Staff assigned to the front counter only"
                color: "#FF5733"
                isActive: true
                createdBy: "usr_01HZ4XY9"
        '400':
