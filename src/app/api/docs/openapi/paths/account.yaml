openapi: 3.0.3
info:
  version: 1.0.0
  title: Retail Smart ERP — Account & Company
  description: Account & Company

servers:
  - url: https://api.example.com
    description: Production Server

tags:
  - name: Account & Company
    description: Authentication, identity, user management, and access control endpoints.
  
security:
  - cookieAuth: []
  - accountCookieAuth: []

paths:
  # ---- /account ----
  /api/account:
    get:
      tags:
        - Account & Company
      summary: Get account profile
      description: >
        Returns the authenticated account owner's full profile.
      operationId: getAccountProfile
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: >
            Account profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "owner@example.com"
                fullName: "Jane Smith"
                phone: "+94771234567"
                country: "LK"
                currency: "LKR"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: Account row not found (session valid but account deleted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Account not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"
    put:
      tags:
        - Account & Company
      summary: Update account profile
      description: >
        Updates the authenticated account owner's profile.
      operationId: updateAccountProfile
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatedAccountRequest'
            examples:
              fullUpdate:
                summary: Update both fullName and phone
                value:
                  fullName: "John Doe"
                  phone: "+9477712345678"
              nameOnly:
                summary: Update fullName only (phone unchanged)
                value:
                  fullName: "John Doe"
      responses:
        '200':
          description: >
            Profile updated successfully. Returns full updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "owner@example.com"
                fullName: "Johe Doe"
                phone: "+9477712345678"
                country: "LK"
                currency: "LKR"
        '400':
          description: >
            Validation failed (invalid body), or phone already registered to another account.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  summary: Body validation failed
                  value:
                    error: "Validation failed"
                    details:
                      - field: "fullName"
                        message: "Full name is required"
                phoneTaken:
                  summary: Phone already in use by another account
                  value:
                    error: "This mobile number is already registered to another account"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: Account not found after update (race condition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Account not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"

  /api/account/preferences:
    get:
      tags:
        - Account & Company
      summary: Get account preferences
      description: >
        Returns the authenticated account's current preferences including language, timezone, date format, currency, theme, and notification settings.
      operationId: getAccountPreferences
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: Preferences retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPreferences'
              example:
                language: "en"
                timezone: "Asia/Colombo"
                dateFormat: "DD/MM/YYYY"
                currency: "LKR"
                theme: "system"
                notifications:
                  email: true
                  billing: true
                  security: true
                  marketing: false
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Account not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"
    put:
      tags:
        - Account & Company
      summary: Update account preferences
      description: >
        Updates one or more preference fields for the authenticated account.
      operationId: updateAccountPreferences
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
            examples:
              themeOnly:
                summary: Change theme only
                value:
                  theme: "dark"
              fullUpdate:
                summary: Update all preference fields
                value:
                  language: "ko"
                  timezone: "Asia/Seoul"
                  dateFormat: "YYYY-MM-DD"
                  currency: "KRW"
                  theme: "dark"
                  notifications:
                    email: true
                    billing: true
                    security: true
                    marketing: false
              notificationsOnly:
                summary: Update notification settings only
                value:
                  notifications:
                    marketing: true
      responses:
        '200':
          description: >
            Preferences updated successfully. Returns full updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPreferences'
              example:
                language: "ko"
                timezone: "Asia/Seoul"
                dateFormat: "YYYY-MM-DD"
                currency: "KRW"
                theme: "dark"
                notifications:
                  email: true
                  billing: true
                  security: true
                  marketing: false
        '400':
          description: >
            Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "currency"
                    message: "Currency must be a 3-letter code"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: Account not found after update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Account not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"

  /api/account/companies:
    get:
      tags:
        - Account & Company
      summary: List account's companies
      description: >
        Returns all active companies (tenants) associated with the authenticated account, including subscription status, storage usage, and storage limits per company.
      operationId: listAccountCompanies
      security:
        - accountCookieAuth: []
      responses:
        '200':
          description: >
            Companies retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyListItem'
              examples:
                withSubscription:
                  summary: Company with active subscription and usage data
                  value:
                    - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                      name: "Sunrise Retail"
                      slug: "sunrise-retail"
                      businessType: "retail"
                      logoUrl: null
                      status: "active"
                      phone: "+94112345678"
                      address: "123 Main St, Colombo"
                      email: "info@sunrise.lk"
                      currency: "LKR"
                      role: "cashier"
                      isOwner: false
                      createdAt: "2025-06-01T10:00:00.000Z"
                      setupCompletedAt: "2025-06-01T10:30:00.000Z"
                      subscription:
                        status: "trial"
                        tierName: "Professional"
                        trialEndsAt: "2026-04-15T00:00:00.000Z"
                        currentPeriodEnd: "2026-04-30T00:00:00.000Z"
                      usage:
                        databaseBytes: 0
                        fileStorageBytes: 0
                        updatedAt: "2026-03-26T00:00:00.000Z"
                      limits:
                        maxDatabaseBytes: null
                        maxFileStorageBytes: null
                noSubscription:
                  summary: Company with no subscription or usage data
                  value:
                    - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                      name: "Sunrise Retail"
                      slug: "sunrise-retail"
                      businessType: "retail"
                      logoUrl: null
                      status: "active"
                      phone: "+94112345678"
                      address: "123 Main St, Colombo"
                      email: "info@sunrise.lk"
                      currency: "LKR"
                      role: "cashier"
                      isOwner: false
                      createdAt: "2025-06-01T10:00:00.000Z"
                      setupCompletedAt: "2025-06-01T10:30:00.000Z"
                      usage:
                        databaseBytes: 0
                        fileStorageBytes: 0
                        updatedAt: "2026-03-26T00:00:00.000Z"
                      limits:
                        maxDatabaseBytes: null
                        maxFileStorageBytes: null
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch companies"
    post:
      tags:
        - Account & Company
      summary: Create a new company
      description: >
        Creates a new company for the authenticated account. Behavior differs based on whether this is the account's first company.
      operationId: createCompany
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            examples:
              firstCompany:
                summary: First company (Flow A) — no tierId needed
                value:
                  name: "Sunrise Retail"
                  slug: "sunrise-retail"
                  businessType: "retail"
                  email: "info@sunrise.lk"
                  phone: "+94112345678"
                  country: "LK"
                  dateFormat: "DD/MM/YYYY"
                  timeFormat: "12h"
              additionalCompany:
                summary: Additional company (Flow B) — tierId required
                value:
                  name: "North Branch"
                  slug: "north-branch"
                  businessType: "retail"
                  country: "LK"
                  dateFormat: "DD/MM/YYYY"
                  timeFormat: "12h"
                  tierId: "d4e5f6a7-b8c9-0123-def0-345678901234"
                  billingCycle: "monthly"
      responses:
        '201':
          description: >
            Company created or pending creation. Check `isPending` to determine which flow was triggered.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CreateCompanyResponse'
                  - $ref: '#/components/schemas/CreateCompanyPendingResponse'
              examples:
                flowA:
                  summary: "Flow A — created immediately, no credit"
                  value:
                    id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    slug: "sunrise-retail"
                    name: "Sunrise Retail"
                    isPending: false
                    creditApplied: null
                flowAWithCredit:
                  summary: "Flow A — created with subscription credit applied"
                  value:
                    id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    slug: "sunrise-retail"
                    name: "Sunrise Retail"
                    isPending: false
                    creditApplied:
                      type: "paid"
                      remainingDays: 23
                flowB:
                  summary: "Flow B — pending payment required"
                  value:
                    id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                    slug: "north-branch"
                    isPending: true
        '400':
          description: >
            Validation failed, slug taken/reserved, invalid country/tier, or race condition detected.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  value:
                    error: "Validation failed"
                    details:
                      - field: "slug"
                        message: "Business code must be at least 3 characters"
                invalidCountry:
                  value:
                    error: "Invalid country selected"
                slugReserved:
                  value:
                    error: "This business code is reserved"
                slugTaken:
                  value:
                    error: "Business code is already taken"
                slugPending:
                  value:
                    error: "Business code is reserved by a pending company"
                tierRequired:
                  value:
                    error: "Pricing tier is required for additional companies"
                invalidTier:
                  value:
                    error: "Invalid pricing tier"
                trialTierRejected:
                  value:
                    error: "Cannot select trial or free tier for additional companies"
                alreadyHasCompany:
                  value:
                    error: "You already have a company. Additional companies require a paid plan."
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '403':
          description: Super admin attempting to create company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Super admins cannot create companies. Use a regular account."
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Account not found"
        '500':
          description: >
            System configuration error (trial tier missing) or unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                trialTierMissing:
                  value:
                    error: "System configuration error: trial tier not found. Please contact support."
                unexpected:
                  value:
                    error: "Failed to create company. Please try again."
    delete:
      tags:
        - Account & Company
      summary: Delete a company
      description: >
        Permanently deletes a company and all its data. Requires the account owner's password for confirmation. Only the company owner (`isOwner: true`) can delete it.
      operationId: deleteCompany
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCompanyRequest'
            example:
              tenantId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
              password: "MySecurePassword123"
      responses:
        '200':
          description: Company deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example: 
                error: "Validation failed"
                details:
                  - field: "tenantId"
                    message: "Invalid uuid"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              example:
                error: "Unauthorized"
                code: "UNAUTHORIZED"
        '403':
          description: >
            Incorrect password, or requester is not the company owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                incorrectPassword:
                  value:
                    error: "Incorrect password"
                    code: "INCORRECT_PASSWORD"
                notOwner:
                  value:
                    error: "Only the owner can delete a company"
                    code: "NOT_OWNER"
        '404':
          description: Account or company not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                accountNotFound:
                  value:
                    error: "Account not found"
                    code: "ACCOUNT_NOT_FOUND"
                companyNotFound:
                  value:
                    error: "Company not found"
                    code: "COMPANY_NOT_FOUND"
        '500':
          description: >
            FK constraint violation or unexpected error during deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                fkViolation:
                  value:
                    error: "Failed to delete company: related data could not be removed. Please contact support."
                    code: "FK_VIOLATION"
                internalError:
                  value:
                    error: "Failed to delete company. Please try again."
                    code: "INTERNAL_ERROR"

  /api/account/companies/{id}/admins:
    get:
      tags:
        - Account & Company
      summary: List admin users for a company
      description: >
        Returns all users belonging to the specified company.
        Only accessible by the primary owner of the company.
      operationId: listCompanyAdmins
      security:
        - accountCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Company (tenant) ID.
          schema:
            type: string
            format: uuid
            example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
      responses:
        '200':
          description: Admin users retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserItem'
              example:
                id: "e5f6a7b8-c9d0-1234-ef01-567890123456"
                fullName: "John Doe"
                email: "john@sunrise.lk"
                role: "cashier"
                isActive: true
                createdAt: "2025-06-01T10:00:00.000Z"
                lastLoginAt: null
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: >
            Company not found or requester is not the primary owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Company not found or not owned by you"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch admin users"
    post:
      tags:
        - Account & Company
      summary: Create an admin user for a company
      description: >
        Creates a new staff user in the specified company.
        Only accessible by the primary owner of the company.
      operationId: createCompanyAdmin
      security:
        - accountCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Company (tenant) ID.
          schema:
            type: string
            format: uuid
            example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
            example:
              fullName: "John Doe"
              email: "john@sunrise.lk"
              password: "SecurePass123"
              role: "manager"
      responses:
        '201':
          description: Admin user created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdminUserResponse'
              example:
                id: "e5f6a7b8-c9d0-1234-ef01-567890123456"
                fullName: "John Doe"
                email: "john@sunrise.lk"
                role: "manager"
                createdAt: "2026-03-28T10:00:00.000Z"
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  value:
                    error: "Validation failed"
                    details:
                      - field: "password"
                        message: "Password must be at least 8 characters"
                duplicatedEmail:
                  value:
                    error: "A user with this email already exists in this company"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: >
            Company not found or requester is not the primary owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Company not found or not owned by you"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to create admin user"

  /api/account/companies/{id}/admins/{userId}:
    put:
      tags:
        - Account & Company
      summary: Update an admin user
      description: >
        Updates one or more fields of a staff user in the specified company.
        Only accessible by the primary owner of the company.
      operationId: updateCompanyAdmin
      security:
        - accountCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Company (tenant) ID.
          schema:
            type: string
            format: uuid
            example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        - name: userId
          in: path
          required: true
          description: User ID to update.
          schema:
            type: string
            format: uuid
            example: "e5f6a7b8-c9d0-1234-ef01-567890123456"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
            examples:
              roleOnly:
                summary: Change role only
                value:
                  role: "cashier"
              deactivate:
                summary: Deactivate user
                value:
                  isActive: false
              passwordAndName:
                summary: Update name and password
                value:
                  fullName: "John Smith"
                  password: "NewSecurePass123"
      responses:
        '200':
          description: Admin user updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAdminUserResponse'
              example:
                id: "e5f6a7b8-c9d0-1234-ef01-567890123456"
                fullName: "John Smith"
                email: "john@sunrise.lk"
                role: "cashier"
                isActive: true
        '400':
          description: >
            Validation failed, or no fields provided to update.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  value:
                    error: "Validation failed"
                    details:
                      - field: "password"
                        message: "Password must be at least 8 characters"
                noFields:
                  value:
                    error: "No fields to update"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: >
            Company not found or not owned by requester, or user not found in this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                companyNotFound:
                  value:
                    error: "Company not found or not owned by you"
                userNotFound:
                  value:
                    error: "User not found"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update admin user"

  /api/account/companies/{id}/switch:
    post:
      tags:
        - Account & Company
      summary: Switch active company context
      description: >
        Validates the requester's membership in the specified company and returns the tenant context data needed to update the client-side session.
      operationId: SwitchCompany
      security:
        - accountCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Company (tenant) ID to switch to.
          schema:
            type: string
            format: uuid
            example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
      responses:
        '200':
          description: >
            Company switch validated. Returns tenant context for client-side session update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchCompanyResponse'
              example:
                tenantId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                tenantSlug: "sunrise-retail"
                tenantName: "Sunrise Retail"
                businessType: "retail"
