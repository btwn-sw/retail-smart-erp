              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to cancel invite"
      
  /users/invites/{id}/resend:
    post:
      tags:
        - Authentication
      summary: Resend a staff invite email
      operationId: resendUserInvite
      description: >
        Extends a staff invite's expiry by 7 days from the current time and re-sends the invite email to the original recipient.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the invite to resend.
          example: "inv_01GHT890"
      responses:
        '200':
          description: >
            Expiry extended and email resent successfully. Does not guarantee email delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendInviteResponse'
              example:
                success: true
                expiresAt: "2026-03-25T10:00:00Z"
        '400':
          description: Invite has already been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invite has already been accepted"
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: >
            Invite not found, or belongs to another tenant. Both cases return the same message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invite not found"
        '422':
          description: Invalid path parameter format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to resend invite"

  # ---- /custom-roles ----
  /custom-roles:
    post:
      tags:
        - Authentication
      summary: Create a custom role
      operationId: CreateCustomRole
      description: >
        Creates a new custom role for the tenant with optional permission overrides.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomRoleRequest'
            example:
              name: "Front Counter Staff"
              baseRole: "cashier"
              description: "Staff assigned to the front counter only"
              color: "#FF5733"
              permissions:
                viewReports: true
                manageInvetory: false
      responses:
        '201':
          description: Custom role created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoleObject'
              example:
                id: "cr_01ABC123"
                tenantId: "ten_01XYZ789"
                name: "Front Counter Staff"
                slug: "front_counter_staff"
                baseRole: "cashier"
                description: "Staff assigned to the front counter only"
                color: "#FF5733"
                createdBy: "usr_01HZ4XY9"
        '400':
          description: >
            baseRole is 'owner', slug is empty (invalid name), or a role with this name already exists.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerBaseRole:
                  summary: Owner used as base role
                  value:
                    error: "Cannot create custom roles based on owner"
                invalidName:
                  summary: Name produces empty slug
                  value:
                    error: "Invalid role name"
                duplicateSlug:
                  summary: Role name already exists
                  value:
                    error: "A custom role with this name already exists"
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '422':
          description: Request body failed schema validation.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to create custom role"
    get:
      tags:
        - Authentication
      summary: List custom roles
      operationId: listCustomRole
      description: >
        Returns all custom roles for the current tenant, each enriched with their permission overrides as a flat key-value map.
      security: 
        - cookieAuth: []
      responses:
        '200':
          description: Custom roles returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomRoleWithPermissions'
              example:
                - id: "cr_01ABC123"
                  tenantId: "ten_01XYZ789"
                  name: "Front Counter Staff"
                  slug: "front_counter_staff"
                  baseRole: "cashier"
                  description: "Staff assigned to the front counter only"
                  color: "#FF5733"
                  createdBy: "usr_01HZ4XY9"
                  permissions:
                    viewReports: true
                    manageInventory: false
                - id: "cr_02DEF456"
                  tenantId: "ten_01XYZ789"
                  name: "Warehouse Manager"
                  slug: "warehouse_manager"
                  baseRole: null
                  color: null
                  createdBy: "usr_01HZ4XY9"
                  permission: {}
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch custom roles"

  /custom-roles/{id}:
    put:
      tags:
        - Authentication
      summary: Update a custom role
      operationId: updateCustomRole
      description: >
        Updates a custom role's fields and/or permission overrides. All fiedls are optional.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The custom role's ID.
          example: "cr_01ABC123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomRoleRequest'
            example:
              name: "Front Counter Staff"
              baseRole: "cashier"
              description: "Staff assigned to the front counter only"
              color: "#FF5733"
              inActive: true
              permissions:
                viewReports: true
                manageInventory: false
      responses:
        '200':
          description: Custom role updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoleObject'
