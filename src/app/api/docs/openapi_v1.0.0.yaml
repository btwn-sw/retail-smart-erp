components:
  securitySchemes: 
    # ---- auth ----
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >
        Session cookie set by NextAuth.js upon login.
    
    # ---- account-auth ----
    accountCookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >
        Session cookie issued by the **account-auth** NextAuth.js instance (`/account-auth/`). Used to authenticate platform account owners and managers.
  
  schemas:
    # ---- Common ----
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "Unauthorized"
      required:
        - error
    
    # ---- Authentication ----
    WsTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: >
            A signed JWT valid for 1 hour. The token payload differes by user type: 
              tenant-mode tokens include `tenantId`, `tenantSlug`, and `role`;
              account-mode tokens include `accountId`.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - token

    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: >
            Indicates whether the current session is valid.
            Always present in the response, even on error.
        reason:
          type: string
          description: >
            Human-readable explanation of why the session is invalid.
            Only present when `valid` is `false`.
      required:
        - valid
    
    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: >
            If an account exists with that email, we've sent password reset instructions.
      required:
        - success
        - message
    
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            The email address associated with the platform account.
            The value is normalized (lowercased and trimmed) before processing.
          example: "user@example.com"
      required:
        - email
    
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: >
            The JWT from the password reset email link (query parameter `token` from the reset URL).
            Must have `purpose: "password-reset"` in its payload.
            Expires 1 hour after being issued.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        newPassword:
          type: string
          format: password
          description: >
            The new password to set. Must meet the application's password complexity requirements as defined in `resetPasswordSchema`.
          example: "NewsecureP@ss123"
      required:
        - token
        - newPassword

    StaffForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: idn-email
          description: >
            The email address of the staff member.
            Normalized (lowercased and trimmed) before processing.
          example: "staff@example.com"
        tenantSlug:
          type: string
          description: >
            The URL slug identifying the company this staff member belongs to.
            Used as part of the rate limit key and to scope the database lookup. The company must exist and have `active` status.
          example: "city-mart"
      required:
        - email
        - tenantSlug
    
    StaffResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: >
            The JWT from the staff password reset email link (query parameter `token` from the reset URL). Must have `purpose: "staff-password-reset"` in its payload. Payload also contains `userId`, `email`, and `tenantId`. Expires 1 hour after being issued. Cannot be used iterchangeably with the platform reset token (`purpose: "password-reset"`).
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        newPassword:
          type: string
          format: password
          description: >
            The new password to set. Must meet the application's password complexity requirements as defined in `staffResetPasswordSchema`.
          example: "NewSecureP@ss123"
      required:
        - token
        - newPassword
    
    TransferAuthRequest:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
          description: >
            the UUID of the company to transfer into.
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        tenantSlug:
          type: string
          description: >
            The URL slug of the company to transfer into.
          example: "city-mart"
      description: >
        At least one of `tenantId` or `tenantSlug` must be provided. If both are provided, `tenantId` takes priority.
    
    TransferAuthResponse:
      type: object
      properties:
        transferToken:
          type: string
          description: >
            A short-lived JWT (expires in **30 seconds**) signed with HS256. Payload contains `accountId`, `tenantSlug`, `type: "company-transfer"`, `ip`, and `userAgent`.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        slug:
          type: string
          description: >
            The resolved company URL slug.
      required:
        - transferToken
        - slug

    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          description: >
            The account owner's full name.
          example: "Jane Smith"
        email:
          type: string
          format: idn-email
          description: >
            Email address for the account.
          example: "jane@example.com"
        password:
          type: string
          format: password
          description: >
            Password for the account.
          example: "SecureP@ss123"
        country:
          type: string
          description: >
            ISO country code.
          example: "KR"
        phone:
          type: string
          description: >
            Mobile phone number.
          example: "+82771234567"
        verficationToken:
          type: string
          description: >
            Optional. JWT issued by the OTP verification flow.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tosAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 timestamp of when the user accepted the Terms of Service. Stored as `null` if not provided.
          example: "2026-03-12T09:00:00.000Z"
      required:
        - fullName
        - email
        - password
        - country
        - phone
    
    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Account created successfully. Please sign in."
        accountId:
          type: string
          format: uuid
          description: >
            The ID of the newly created account.
            Note: registration does not auto-sign-in — the user must navigate to the login page.
          example: "a1b2c3d4-5678-90ab-cdef-1234567890ab"
      required:
        - success
        - message
        - accountId
    
    CheckEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            The email address to check for availability.
          example: "jane@example.com"
      required:
        - email
    
    CheckEmailResponse:
      type: object
      properties:
        available:
          type: boolean
          description: >
            `true` if the email address is not yet registered and may be used for a new account. `false` if the email is already taken.
          example: true
      required:
        - available
    
    SendOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            The email address to send the OTP to. Normalized (lowercased and trimmed) before processing.
          example: "jane@example.com"
        type:
          type: string
          description: >
            The verification purpose. Scopes both the OTP record and the rate limit — a user's limit for `"registration"` and `"email-change"` are tracked independently.
          example: "registration"
      required:
        - email
        - type
    
    VerifyOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            The email address that received the OTP.
          example: "jane@example.com"
        otp:
          type: string
          description: >
            The 5-digit verfication code received via email.
          example: "47291"
        type:
          type: string
          description: >
            The verification purpose. Mismatched types will fail even if the OTP code is correct.
          example: "registration"
      required:
        - email
        - otp
        - type
    
    VerifyOtpResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        verificationToken:
          type: string
          description: >
            A short-lived JWT (expires in **15 minutes**) signed with HS256.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - success
        - verificationToken
    
    LookupTenantRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            The email address to look up.
          example: "jane@example.com"
      required:
        - email
    
    TenantSummary:
      type: object
      description: >
        A minimal company record returned in the lookup response.
      properties:
        slug:
          type: string
          description: >
            The company's URL slug.
          example: "city-mart"
        name:
          type: string
          description: >
            The company's display name.
      required:
        - slug
        - name
    
    LookupTenantResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
          description: >
            List of active companies associated with the email address. Returns an **empty array** if the email is not registered or has no active company memberships.
      required:
        - tenants
    
    LookupTenantBySlugResponse:
      type: object
      properties:
        tenant:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: The company's UUID.
                  example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
                slug:
                  type: string
                  description: The company's URL slug.
                  example: "city-mart"
              required:
                - id
                - slug
            - nullable: true
              enum: [null]
          description: >
            The matched tenant object if found and active, or `null` if no active tenant exists for the given slug.

    InviteTenantAssignment:
      type: object
      description: >
        A single company-role assignment included in the invite. Each invite may contain one or more assignments.
      properties:
        tenantId:
          type: string
          format: uuid
          description: The company's UUID.
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        tenantName:
          type: string
          description: >
            The company's display name. Returns `"Unkown Company"` if the tenant record cannot be found.
          example: "City Mart"
        tenantSlug:
          type: string
          nullable: true
          description: >
            The company's URL slug. May be `null` if the tenant record cannot be resolved.
          example: "city-mart"
        businessType:
          type: string
          nullable: true
          description: >
            The company's business type (e.g. `"retail"`, `"restaurant"`). May be `null` if the tenant record cannot be resolved.
          example: "retail"
        role:
          type: string
          description: >
            The role the invitee will be assigned in this company on acceptance.
          example: "cashier"
      required:
        - tenantId
        - tenantName
        - role
      
    InviteDetailsResponse:
      type: object
      description: >
        Public details of a staff invite, returned to the invite acceptance page before the recipient accepts.
      properties:
        email:
          type: string
          description: >
            The invite recipient's email address, **masked** for privacy.
          example: "j***@example.com"
        invitedBy:
          type: string
          description: >
            The full name of the account that sent this invite. Returns `"Someone"` if the inviter's account cannot be found or if `invitedBy` is null on the invite record.
          example: "Jane Smith"
        expiresAt:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of when this invite expires.
          example: "2026-03-23T09:00:00.000Z"
        tenantAssignments:
          type: array
          items:
            $ref: '#/components/schemas/InviteTenantAssignment'
          description: >
            List of company-role assignments included in this invite.
        hasExistingAccount:
          type: boolean
          description: >
            `true` if the invite recipient's email address already has a registered platform account.
          example: 'false'
      required:
        - email
        - invitedBy
        - expiresAt
        - tenantAssignments
        - hasExistingAccount
    
    AcceptInviteRequest:
      type: object
      description: >
        Request body for accepting a staff invite. Field requirements depend on whether the invitee already has a platform account.
      properties:
        fullName:
          type: string
          description: >
            **Required only if `hasExistingAccount` is `false`.** The new staff member's display name.
          example: "John Smith"
        password:
          type: string
          format: password
          description: >
            **Required only if `hasExistingAccount` is `false`.** Password for the new staff account.
          example: "SecureP@ss123"
    
    AcceptedTenantDetail:
      type: object
      description: >
        A company the invite has been granted access to upon accepting the invite.
      properties:
        tenantId:
          type: string
          format: uuid
          example: "b3d2e1f0-1234-5678-abcd-ef0123456789"
        tenantName:
          type: string
          description: >
            Company display name. Returns `"Unknown"` if the tenant record cannot be resolved.
          example: "City Mart"
        tenantSlug:
          type: string
          nullable: true
          example: "city-mart"
        role:
          type: string
          description: >
            The role assigned to the invitee in this company.
          example: "cashier"
      required:
        - tenantId
        - tenantName
        - role
    
    AcceptInviteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Invite accepted successfully"
        email:
          type: string
          format: email
          description: >
            The invitee's **full** (unmasked) email address.
          example: "john.smith@example.com"
        companies:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedTenantDetail'
          description: >
            List of companies the invitee now has access to.
      required:
        - success
        - message
        - email
        - companies

    UserObject:
      type: object
      description: >
        A single staff user record belonging to the current tenant.
      properties:
        id:
          type: string
          format: uuid
          example: "usr_01HZ4XY9"
        email:
          type: string
          format: email
          example: "john.smith@example.com"
        fullName:
          type: string
          example: "John Smith"
        role: 
          type: string
          enum: [owner, manager, cashier, technician]
          example: "cashier"
        isActive:
          type: boolean
          example: true
        lastLoginAt:
          type: string
          format: date-time
          example: "2026-03-10T08:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-10T09:00:00Z"
      required:
        - id
        - email
        - fullName
        - role
        - isActive
        - createdAt
        - updatedAt
    
    WarehouseAssignment:
      type: object
      description: >
        A warehouse assignment linked to a user.
      properties:
        warehouseId:
          type: string
          format: uuid
          example: "wh_01ABC123"
        warehouse:
          $ref: '#/components/schemas/WarehouseObject'
      required:
        - warehouseId
        - warehouse
    
    UserWithWarehouses:
      allOf:
        - $ref: '#/components/schemas/UserObject'
        - type: object
          properties:
            warehouses:
              type: array
              description: >
                Warehouse assignments for this user. Only present when `includeWarehouses` is `true`.
              items:
                $ref: '#/components/schemas/WarehouseAssignment'
              example: []
    
    CreateInviteRequest:
      type: object
      description: >
        Request body to add or invite a staff member.
      properties:
        email:
          type: string
          format: email
          description: Email of the staff member to add or invite. 
        role:
          type: string
          enum: [manager, cashier, technician]
          description: Role to assign.
          example: "cashier"
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
          description: Optional list of warehouse IDs to assign to the new user.
          example: ["wh_01ABC123", "wh_02DEF456"]
      required:
        - email
        - role
    
    AddedUserResponse:
      type: object
      description: >
        Returned when the invited email already has a platform account.
      properties:
        mode: 
          type: string
          enum: [added]
          example: "added"
        user:
          $ref: '#/components/schemas/UserObject'
      required:
        - mode
        - user
    
    InviteDetail:
      type: object
      description: Details of a pending staff invite.
      properties:
        id:
          type: string
          format: uuid
          example: "inv_01GHT890"
        email:
          type: string
          format: email
          example: "newstaff@example.com"
        role:
          type: string
          enum: [manager, cashier, technician]
          example: "cashier"
        expiresAt:
          type: string
          format: date-time
          description: Invite Link expires 7 days after creation.
          example: "2026-03-24T10:00:00Z"
        inviteUrl:
          type: string
          format: uri
          description: >
            Full URL the invitee visits to accept.
          example: "https://app.example.com/invite/a1b2c3d4e5f6..."
      required:
        - id
        - email
        - role
        - expiresAt
        - inviteUrl
    
    InvitedUserResponse:
      type: object
      description: >
        Returned when the invited email has no platform account yet. An invite record is created and an email is sent.
      properties:
        mode:
          type: string
          enum: [invited]
          example: "invited"
        invite:
          $ref: '#/components/schemas/InviteDetail'
      required:
        - mode
        - invite
    
    UpdateUserRequest:
      type: object
      description: Request body for updating a user.
      properties:
        fullName:
          type: string
          example: "Jane Smith"
        email:
          type: string
          format: email
          example: “jane@example.com"
        role:
          type: string
          enum: [manager, cashier, technician]
          description: >
            Cannot be set to `owner` via this endpoint. A caller cannot change their own role.
          example: "manager"
        isActive:
          type: boolean
          description: A caller cannot change their own isActive status.
          example: true
        password:
          type: string
          description: New plaintext password.
          example: "NewSecureP@ss123"
        expectedUpdatedAt:
          type: string
          format: date-time
          description: Optional optimistic lock token.
          example: "2026-03-10T09:00:00Z"
    
    ConflictErrorResponse:
      type: object
      description: >
        Returned when a concurrent edit is detected (optimistic locking).
      properties:
        error:
          type: string
          example: "This user was modified by another user. Please refresh and try again"
        code:
          type: string
          enum: [CONFLICT]
          example: "CONFLICT"
      required:
        - error
        - code
    
    DeleteSucessResponse:
      type: object
      description: >
        Returned on successful soft-delete (deactivation).
      properties:
        success:
          type: boolean
          example: true
      required:
        - success
    
    WarehouseObject:
      type: object
      description: >
        A warehouse record embedded inside an assignment.
      properties:
        id:
          type: string
          format: uuid
          example: "wh_01ABC123"
        name:
          type: string
          example: "Main Warehouse"
        code:
          type: string
          example: "WH-MAIN"
        isDefault:
          type: boolean
          example: true
      required:
        - id
        - name
        - code
        - isDefault
    
    UserWarehouseAssignment:
      type: object
      description: >
        A direct warehouse-to-user assignment row, with the full warehouse record eager-loaded.
      properties:
        userId:
          type: string
          format: uuid
          example: "usr_01HZ4XY9"
        warehouseId:
          type: string
          format: uuid
          example: "wh_01ABC123"
        warehouse:
          $ref: '#/components/schemas/WarehouseObject'
        isActive:
          type: boolean
          example: true
      required:
        - userId
        - warehouseId
        - warehouse
        - isActive
    
    PosProfileObject:
      type: object
      description: >
        A POS profile record with its associated warehouse eager-loaded.
      properties:
        id:
          type: string
          format: uuid
          example: "pos_01XYZ789"
        name:
          type: string
          example: "Front Counter POS"
        warehouseId:
          type: string
          format: uuid
          example: "wh_01ABC123"
        warehouse:
          $ref: '#/components/schemas/WarehouseObject'
      required:
        - id
        - name
        - warehouseId
        - warehouse
    
    PosProfileUserAssignment:
      type: object
      description: >
        A POS profile-to-user assignment row, with the full POS profile (and its warehouse) eager-loaded.
      properties:
        userId:
          type: string
          format: uuid
          example: "usr_01HZ4XY9"
        posProfileId:
          type: string
          format: uuid
          example: "pos_01XYZ789"
        posProfile:
          $ref: '#/components/schemas/PosProfileObject'
      required:
        - userId
        - posProfileId
        - posProfile
    
    UserWarehousesResponse:
      type: object
      description: >
        Combined response containing both direct warehouse assignments and POS profile assignments for a user.
      properties:
        assignments:
          type: array
          description: Direct warehouse-to-user assignments.
          items:
            $ref: '#/components/schemas/UserWarehouseAssignment'
        posProfileAssignments:
          type: array
          description: >
            POS profile-to-user assginemtns, each including the POS profile's associated warehouse.
          items:
            $ref: '#/components/schemas/PosProfileUserAssignment'
      required:
        - assignments
        - posProfileAssignments
    
    UpdateUserWarehouseRequest:
      type: object
      description: >
        Request body to replace a user's warehouse assignments. This is a full-replace operation — the provided list becomes the user's complete set of warehouse assignments.
      properties:
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Complete desired set of warehouse IDs for this user.
          example: ["wh_01ABC123", "wh_02DEF456"]
      required:
        - warehouseIds
    
    UpdateUserWarehouseResponse:
      type: object
      description: >
        Result of a warehouse assignment replacement, including the updated full assignment list and a summary of changes made.
      properties:
        assignments:
          type: array
          description: >
            Updated full list of warehouse assignments after the operation.
          items:
            $ref: '#/components/schemas/UserWarehouseAssignment'
        added:
          type: integer
          description: >
            Number of new warehouse assignments created.
          example: 2
        removed:
          type: integer
          description: >
            Number of warehouse assignments deleted.
          example: 1
      required:
        - assignments
        - added
        - removed
    
    PendingInviteItem:
      type: object
      description: >
        A single staff invite enriched for the current tenant.
      properties:
        id:
          type: string
          format: uuid
          example: "inv_01GHT890"
        email:
          type: string
          format: email
          example: "newstaff@example.com"
        role:
          type: string
          example: "cashier"
        expiresAt:
          type: string
          format: date-time
          example: "2026-03-24T10:00:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-03-17T10:00:00Z"
        status:
          type: string
          enum: [pending, expired]
          description: Computed server-side.
          example: "pending"
      required:
        - id
        - email
        - role
        - expiresAt
        - createdAt
        - status
    
    DeleteSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    ResendInviteResponse:
      type: object
      description: >
        Returned on successful resend. Confirms the expiry was extended and provides the new expiry timestamp.
      properties:
        success:
          type: boolean
          example: true
        expiresAt:
          type: string
          format: date-time
          description: New expiry timestamp.
          example: "2026-03-25T10:00:00Z"
      required:
        - success
        - expiresAt
    
    CustomRoleObject:
      type: object
      description: A custom role record as stored in the database.
      properties:
        id:
          type: string
          format: uuid
          example: "cr_01ABC123"
        tenantId:
          type: string
          format: uuid
          example: "ten_01XYZ789"
        name:
          type: string
          example: "Front Counter Staff"
        slug:
          type: string
          description: Server-generated from name.
          example: "front_counter_staff"
        baseRole:
          type: string
          enum: [manager, cashier, technician]
          description: >
            The built-in role this custom role inherits from. Cannot be 'owner'.
          example: "cashier"
        description:
          type: string
          nullable: true
          example: "Staff assigned to the front counter only"
        color:
          type: string
          nullable: true
          example: "#FF5733"
        createdBy:
          type: string
          format: uuid
          example: "usr_01HZ4XY9"
      required:
        - id
        - tenantId
        - name
        - slug
        - baseRole
        - createdBy
    
    CustomRoleWithPermissions:
      allOf:
        - $ref: '#/components/schemas/CustomRoleObject'
        - type: object
          properties:
            permissions:
              type: object
              description: >
                Permission overrides for this role as a flat key-value map.
              additionalProperties:
                type: boolean
              example:
                viewReports: true
                manageInventory: true
            isActive:
              type: boolean
              example: true
          required:
            - permissions
    
    CreateCustomRoleRequest:
      type: object
      description: Request body to create a new custom role.
      properties:
        name:
          type: string
          description: Display name of the custom role.
          example: "Front Counter Staff"
        baseRole:
          type: string
          enum: [manager, cashier, tachnician]
          description: The built-in role to inherit from. Cannot be 'owner'.
          example: "cashier"
        description:
          type: string
          nullable: true
          example: "Staff assigned to the front counter only"
        color:
          type: string
          nullable: true
          description: Optional display color for the role (e.g. hex code).
          example: "#FF5733"
        permissions:
          type: object
          description: >
            Optioanl permission overrides as a flat key-value map. Unknown keys and owner-only permissions are silently skipped.
          additionalProperties:
            type: boolean
          example:
            viewReports: true
            manageInventory: false
      required:
        - name
        - baseRole
    
    UpdateCustomRoleRequest:
      type: object
      description: Request body to update a custom role.
      properties:
        name:
          type: string
          description: >
            When updated, the slug is automatically regenerated server-side.
          example: "Front Counter Staff"
        baseRole:
          type: string
          enum: [manager, cashier, technician]
          description: Cannot be 'owner'.
          example: "cashier"
        description:
          type: string
          nullable: true
          example: "Staff assigned to the front counter only"
        color:
          type: string
          nullable: true
          example: "#FF5733"
        isActive:
          type: boolean
          description: Set to false to deactivate the custom role.
          example: true
        permissions:
          type: object
          description: >
            Full replacement set of permission overrides. If provided, replaces all existing overrides. If omitted, existing overrides are unchanged.
          additionalProperties:
            type: boolean
          example:
            viewReports: true
            manageInventory: false
    
    RolePermissionsResponse:
      type: object
      description: >
        Full permission state for the tenant, containing three sections: built-in role overrides, custom roles with permissions, and the system default permission map.
      properties:
        builtinOverrides:
          type: object
          description: >
            Permission overrides applied to built-in roles (manager, cashier, technician), grouped by role name.
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean
          example:
            manager:
              viewReports: false
            cashier:
              manageInventory: true
        customRoles:
          type: array
          description: >
            All custom roles for the tenant, each enriched with their permission overrides.
          items:
            $ref: '#/components/schemas/CustomRoleWithPermissions'
        systemDefaults:
          type: object
          description: >
            The full system-default permission map. Shows which built-in roles have each permission by default, before any overrides are applied.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            viewReports: ["owner", "manager"]
            manageInventory: ["owner", "manager", "technician"]
      required:
        - builtinOverrides
        - customRoles
        - systemDefaults
    
    UpdateRolePermissionsRequest:
      type: object
      description: >
        Request body to replace permission overrides for a single built-in role. Only applies to built-in roles — not custom roles.
      properties:
        role:
          type: string
          enum: [manager, cashier, technician]
          description: >
            The built-in role to update. Cannot be 'owner'.
          example: "manager"
        overrides:
          type: object
          additionalProperties:
            type: boolean
          description: >
            Complete desired permission override set for this role. This is a full replace — existing overrides are deleted before inserting the new set.
          example:
            viewReports: true
            manageInventory: false
      required:
        - role
        - overrides
    
    EffectivePermissionsResponse:
      type: object
      description: >
        The fully resolved permission set for the currently authenticated user.
      properties:
        permissions:
          type: object
          additionalProperties:
            type: boolean
          description: >
            Flat map of permission keys to their resolved boolean values.
          example:
            viewReports: true
            manageInventory: false
            manageTenant: false
            manageUsers: true
      required:
        - permissions
    
    ResetRolePermissionsRequest:
      type: object
      description: >
        Request body to reset a built-in role's permissions to system defaults.
      properties:
        role:
          type: string
          enum: [manager, cashier, techinician]
          description: >
            The built-in role to reset. Cannot be 'owner'.
          example: "manager"
      required: 
        - role
    
    ModuleAccessRow:
      type: object
      description: >
        A single module access control row representing whether a specific role has access to a specific module for this tenant.
      properties:
        id:
          type: string
          format: uuid
          example: "ma_01ABC123"
        tenantId:
          type: string
          format: uuid
          example: "ten_01XYZ789"
        moduleKey:
          type: string
          description: Identifier for the module (e.g., 'inventory', 'workshop').
          example: "workshop"
        role:
          type: string
          enum: [owner, manager, cashier, technician]
          example: "technician"
        isEnabled:
          type: boolean
          description: Whether this role has access to this module.
          example: true
        updatedBy:
          type: string
          format: uuid
          example: "usr_01HZ4XY9"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-17T10:00:00Z"
      required:
        - id
        - tenant
        - moduleKey
        - role
        - isEnabled
        - updatedBy
    
    ModuleAccessEntry:
      type: object
      description: >
        A single entry in a bulk module access update request.
      properties:
        moduleKey:
          type: string
          description: Identifier for the module to update.
          example: "workshop"
        role:
          type: string
          enum: [owner, manager, cashier, technician]
          example: "technician"
        isEnabled:
          type: boolean
          example: true
      required:
        - moduleKey
        - role
        - isEnabled
    
    UpdateModuleAccessRequest:
      type: object
      description: >
        Request body for bulk-upserting module access entries.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAccessEntry'
          example:
            - moduleKey: "workshop"
              role: "technician"
              isEnabled: true
            - moduleKey: "workshop"
              role: "cashier"
              isEnabled: false
      required:
        - entries
    
