  /api/account/notifications:
    get:
      tags:
        - Account & Company
      summary: Get account notifications
      description: >
        Returns notifications for the authenticated account, ordered by creation date descending. Always includes the total unread count regardless of filters.
      operationId: getAccountNotifications
      security:
        - accountCookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: >
            Maximum number of notifications to return. Default 50, max 100.
          schema:
            type: integer
            default: 50
            maximum: 100
            example: 50
        - name: unread
          in: query
          required: false
          description: >
            If `true`, returns only unread notifications.
          schema:
            type: string
            enum: ["true", "false"]
            example: "true"
      responses:
        '200':
          description: Notifications retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
              examples:
                withNotifications:
                  summary: Account with unread notifications
                  value:
                    notifications:
                      - id: "f7a8b9c0-d1e2-3456-f789-012345678901"
                        type: "payment"
                        title: "Payment received"
                        message: "Your payment of LKR 2,900 has been confirmed."
                        link: "/billing/payments"
                        isRead: false
                        readAt: null
                        metadata: {}
                        createdAt: "2026-03-29T10:00:00.000Z"
                    unreadCount: 1
                noNotifications:
                  summary: Account with no notifications
                  value:
                    notifications: []
                    unreadCount: 0
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to fetch notifications"
    post:
      tags:
        - Account & Company
      summary: Create a notification (internal use)
      description: >
        Creates a notification for the authenticated account.
      operationId: createAccountNotification
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
            example:
              type: "payment"
              title: "Payment received"
              message: "Your payment of LKR 2,900 has been confirmed."
              link: "/billing/payments"
              metadata: {}
      responses:
        '200':
          description: Notification created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedNotification'
              example:
                id: "f7a8b9c0-d1e2-3456-f789-012345678901"
                accountId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                type: "payment"
                title: "Payment received"
                message: "Your payment of LKR 2,900 has been confirmed."
                link: "/billing/payments"
                isRead: false
                readAt: null
                metadata: {}
                createdAt: "2026-03-29T10:00:00.000Z"
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "type"
                    message: "Type is required"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to create notification"
    put:
      tags:
        - Account & Company
      summary: Mark notifications as read
      description: >
        Marks one or more notifications as read.
        Either `markAllRead: true` or a non-empty `notificationIds` array must be provided.
        When `markAllRead` is true, only currently unread notifications are updated.
        When `notificationIds` is provided, only notifications owned by this account are updated.
      operationId: updateAccountNotifications
      security:
        - accountCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationsRequest'
            examples:
              markAll:
                summary: Mark all notifications as read
                value:
                  markAllRead: true
              markSpecific:
                summary: Mark specific notifications as read
                value:
                  notificationIds:
                    - "f7a8b9c0-d1e2-3456-f789-012345678901"
                    - "a8b9c0d1-e2f3-4567-890a-123456789012"
      responses:
        '200':
          description: Notifications marked as read successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: Validation failed or neither field provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: ""
                    message: "Either notificationIds or markAllRead is required"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                error: "Unauthorized"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to update notifications"
    delete:
      tags:
        - Account & Company
      summary: Delete notification(s)
      description: >
        Deletes one or all notifications for the authenticated account.
      operationId: deleteAccountNotifications
      security:
        - accountCookieAuth: []
      parameters:
        - name: id
          in: query
          required: false
          description: >
            ID of the specific notification to delete.
          schema:
            type: string
            format: uuid
            example: "f7a8b9c0-d1e2-3456-f789-012345678901"
        - name: all
          in: query
          required: false
          description: >
            If `true`, deletes all notifications for this account.
          schema:
            type: string
            enum: ["true"]
            example: "true"
      responses:
        '200':
          description: Notification(s) deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: Neither `id` nor `all=true` was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Either id or all=true is required"
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to delete notification"

